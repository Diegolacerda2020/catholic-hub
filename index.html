    const ate = new Date(velaUlt.ts + DAY);
    const alvo = velaUlt.para==='alguem' && velaUlt.por ? ` por ${esc(velaUlt.por)}` : velaUlt.para==='almas' ? ' pelas almas' : velaUlt.para==='gracas' ? ' em ação de graças' : '';
    return `<div class="vela-hero" role="status">${candle(true)}<h3>Sua vela está acesa${alvo}</h3>
      <p class="small">Ficará acesa até ${DIAS[ate.getDay()]}, às ${pad(ate.getHours())}h${pad(ate.getMinutes())}.</p>
      <p class="prayer">${ORACAO_VELA[velaUlt.para]}</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <a class="btn wa" href="${waShare('Acendi uma vela na página da '+c.nome+'. Acenda você também e reze comigo. 🕯️')}" target="_blank" rel="noopener">Convidar alguém</a>
        <button class="btn ghost" style="color:#F4EEDF;border-color:#F4EEDF" id="velaNova">Acender outra</button></div></div>`;
  }
  return `<div class="vela-hero">${candle(false)}<h3>Vela virtual</h3>
    <p class="small">Acenda uma vela, deixe seu pedido e reze por quem você ama ou por quem não tem quem reze por ele.</p>
    <p class="small" style="margin-top:8px;color:#ffd766">${n ? `${n} vela${n===1?' acesa':'s acesas'} nas últimas 24 horas` : 'Seja o primeiro a acender uma vela hoje'}</p>
    <button class="btn gold" id="velaIr">Acender uma vela</button></div>`;
}
function bindVela(root){
  root.querySelector('#velaIr')?.addEventListener('click', () => { velaStep='form'; render(); document.getElementById('view').scrollIntoView(); });
  root.querySelector('#velaVoltar')?.addEventListener('click', () => { velaStep='inicio'; render(); });
  root.querySelector('#velaNova')?.addEventListener('click', () => { velaStep='form'; render(); });
  root.querySelector('#copyPix')?.addEventListener('click', () => { copiar(S.cfg.pix); });
  root.querySelector('#velaF')?.addEventListener('submit', async e => {
    e.preventDefault(); const f = e.target;
    velaUlt = {id:novoId(), ts:now(), para:f.para.value, por:f.por.value.trim(), pedido:f.pedido.value.trim(), nome:f.nome.value.trim(), rezar:f.rezar.checked};
    if (NUVEM.ativo && !logado()){ // fiel sem login: o pedido vai direto para a equipe da paróquia
      const btn = f.querySelector('button.gold:not([type=button])'); if (btn) btn.disabled = true;
      if (!await enviarPublico('vela', velaUlt)){ if (btn) btn.disabled = false; toast('Não foi possível acender agora. Tente de novo em instantes.'); return; }
      NUVEM.velasPub = (NUVEM.velasPub || 0) + 1;
    } else { S.velas.push(velaUlt); save(); }
    velaStep='acesa'; render(); scrollTo(0,0);
  });
}
function velasPainelHTML(){
  const lim = now() - 7*DAY, l = S.velas.filter(v => v.ts > lim && v.rezar && (v.pedido || v.por || v.para==='almas')).sort((a,b)=>b.ts-a.ts);
  const velhas = S.velas.filter(v => v.ts <= lim).length;
  return `<h2>Pedidos da vela virtual</h2>
  <p class="lead small">${velasHoje()} vela${velasHoje()===1?'':'s'} nas últimas 24 horas. Pedidos dos últimos 7 dias em que a pessoa pediu a oração da comunidade.</p>
  ${l.length ? `<div class="list">${l.map(v=>`<div class="row"><div class="grow"><span class="chip">${PARA_VELA[v.para]}</span>${v.por?` <b>${esc(v.por)}</b>`:''}
    ${v.pedido?`<div style="margin-top:4px">${esc(v.pedido)}</div>`:''}<div class="small muted">${v.nome?esc(v.nome):'Anônimo'}, ${ago(v.ts)}</div></div></div>`).join('')}</div>
    <button class="btn sm ghost" id="copyVelas">Copiar pedidos para a oração</button>` : '<div class="empty">Nenhum pedido nos últimos 7 dias.</div>'}
  ${velhas ? `<div class="block small" style="margin-top:10px">${velhas} vela${velhas===1?'':'s'} com mais de 7 dias. <button class="link-btn" id="limparVelas">Apagar</button></div>` : ''}`;
}
function bindVelasPainel(root){
  root.querySelector('#copyVelas')?.addEventListener('click', () => {
    const lim = now() - 7*DAY, l = S.velas.filter(v => v.ts > lim && v.rezar && (v.pedido || v.por || v.para==='almas'));
    copiar('Pedidos de oração da vela virtual\n\n' + l.map(v => '• ' + [PARA_VELA[v.para], v.por, v.pedido].filter(Boolean).join(': ')).join('\n'));
    registrar('copiou-velas');
  });
  root.querySelector('#limparVelas')?.addEventListener('click', () => { const lim = now() - 7*DAY; S.velas = S.velas.filter(v => v.ts > lim); save(); render(); toast('Velas antigas apagadas'); });
}


/* ---------- escolher / trocar de paróquia ---------- */
const ATIVA = 'Santo Antônio|Jaraguá';
const keyOf = r => r.nome+'|'+r.bairro;
const vendoAtiva = () => S.vendo === ATIVA;
const vendoRede = () => REDE.find(r => keyOf(r)===S.vendo) || null;
const nomeRede = r => { const b = (r.bairro||'').split('/')[0]; return `${r.tipo==='santuario'?'':'Paróquia '}${r.nome}${b && !r.nome.includes(b) ? ' – '+b : ''}`; };
function nomeVendo(){ if (vendoAtiva()) return S.cfg.nome; const r = vendoRede(); return r ? nomeRede(r) : S.cfg.nome; }
const semAcento = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let buscaPar = '';
function escolherHTML(){
  const q = semAcento(buscaPar.trim());
  const minha = REDE.find(r => keyOf(r)===S.minha);
  let lista;
  if (q) lista = REDE.filter(r => semAcento(r.nome+' '+r.bairro+' '+r.cidade+' '+r.forania).includes(q));
  else { const fo = (vendoRede()||minha)?.forania; lista = REDE.filter(r => r.forania===fo); }
  const row = r => { const k = keyOf(r), at = k===ATIVA;
    return `<button class="pick-row" data-pick="${esc(k)}"><span class="grow"><b>${esc(r.nome)}</b>${r.bairro?` <span class="muted">(${esc(r.bairro)})</span>`:''}
      <span class="small muted" style="display:block">${esc(r.cidade||'')}${r.cidade?' · ':''}Forania ${esc(r.forania)}</span>
      <span class="tagline" style="margin-top:3px">${at?'<span class="chip">✓ Página ativa</span>':'<span class="chip gold">Página ainda não ativada</span>'}${k===S.minha?'<span class="chip">Minha paróquia</span>':''}${k===S.vendo?'<span class="chip">Vendo agora</span>':''}</span></span><span class="muted" aria-hidden="true">›</span></button>`; };
  return `<h2>Escolher paróquia</h2>
  <p class="lead small">Pesquise pelo nome da paróquia, do bairro ou da cidade.</p>
  <input type="text" id="buscaPar" placeholder="Ex.: São Bernardo, Planalto, Vespasiano" aria-label="Pesquisar paróquia" value="${esc(buscaPar)}" style="margin-bottom:12px">
  ${!q && minha ? `<h2 style="margin-top:6px">Minha paróquia</h2><div class="list">${row(minha)}</div>` : ''}
  <h2 style="margin-top:14px">${q ? `${lista.length} resultado${lista.length===1?'':'s'}` : `Forania ${esc((vendoRede()||minha)?.forania||'')}`}</h2>
  ${lista.length ? `<div class="list">${lista.slice(0,60).map(row).join('')}</div>` : '<div class="empty">Nenhuma paróquia encontrada.</div>'}
  <p class="small muted" style="margin:10px 4px">Por enquanto, a busca inclui as ${REDE.length} paróquias e santuários da Região Episcopal Nossa Senhora da Conceição (RENSC). As demais regiões da Arquidiocese entram nas próximas etapas.</p>
  <button class="btn ghost block-w" id="pickVoltar">Voltar</button>`;
}
function bindEscolher(root){
  const b = root.querySelector('#buscaPar');
  b.addEventListener('input', () => { buscaPar = b.value; const pos = b.selectionStart; render(); const n = document.getElementById('buscaPar'); n.focus(); n.setSelectionRange(pos,pos); });
  root.querySelectorAll('[data-pick]').forEach(x => x.onclick = () => { S.vendo = x.dataset.pick; S.pubTab = 'igreja'; velaStep = 'inicio'; save(); render(); scrollTo(0,0); });
  root.querySelector('#pickVoltar').onclick = () => { S.pubTab = 'igreja'; save(); render(); };
}
function minhaBtn(){
  return S.vendo===S.minha
    ? `<div class="small muted" style="text-align:center;margin:10px 0">★ Esta é a sua paróquia</div>`
    : `<button class="btn ghost block-w" id="tornarMinha" style="margin:10px 0">★ Tornar esta a minha paróquia</button>`;
}
function bindMinha(root){ root.querySelector('#tornarMinha')?.addEventListener('click', () => { S.minha = S.vendo; save(); render(); toast('Agora esta é a sua paróquia'); }); }

/* página básica de paróquia que ainda não ativou */
function inativaCard(r){
  return `<div class="block"><span class="chip gold">Página ainda não ativada</span>
    <h3 style="font-family:var(--serif);font-size:1.25rem;margin:8px 0 6px">${esc(nomeRede(r))}</h3>
    <p style="margin:0 0 4px">${esc(r.end)}${r.cidade?`, ${esc(r.cidade)}`:''}${r.cep?`, ${esc(r.cep)}`:''}</p>
    <p class="small" style="margin:0">${r.tel?`Telefone ${esc(r.tel)}`:''}${r.email?`<br>E-mail <a href="mailto:${esc(r.email)}">${esc(r.email)}</a>`:''}</p>
    ${r.resp?`<p class="small" style="margin:8px 0 0">${esc(r.resp)}</p>`:''}
    <p class="small muted" style="margin:8px 0 0">Forania ${esc(r.forania)} · RENSC · Dados do Catálogo 2026 da Arquidiocese</p>
    ${r.tel?`<a class="btn block-w" style="margin-top:12px" href="${telLink(r.tel)}">Ligar para a secretaria</a>`:''}</div>`;
}
function ativarHTML(r){
  const ja = S.pedidosAtivacao.includes(keyOf(r));
  return `<details class="fold"><summary>É desta paróquia? Ative a página</summary><div class="inner">
    <p class="small" style="margin-top:0">Com a página ativa, a paróquia publica avisos, horários de missa, recebe intenções e pedidos da vela virtual, e fala com os paroquianos pelo WhatsApp.</p>
    <p class="small muted">Por segurança, a ativação é confirmada pelo telefone ou e-mail oficiais que constam no catálogo da Arquidiocese, com autorização do pároco.</p>
    ${ja ? '<div class="signal green" style="margin:0">Pedido registrado. Entraremos em contato pelo canal oficial da paróquia.</div>' : '<button class="btn sm" id="pedirAtiv">Quero ativar a página</button>'}
  </div></details>`;
}
function inativaAvisosHTML(){
  const r = vendoRede();
  return `${inativaCard(r)}
  <div class="empty">Esta paróquia ainda não publica avisos por aqui.</div>
  ${minhaBtn()}${ativarHTML(r)}`;
}
function inativaMissasHTML(){
  const r = vendoRede();
  return `<h2>Horário de missas</h2><div class="block"><p style="margin:0 0 10px">Esta paróquia ainda não publicou os horários aqui. Confirme com a secretaria.</p>
    ${r.tel?`<a class="btn block-w" href="${telLink(r.tel)}">Ligar ${esc(r.tel)}</a>`:''}</div>
  <h2>Intenções de missa</h2><div class="block small muted">O pedido de intenção fica disponível quando a paróquia ativar a página.</div>`;
}
function inativaContatoHTML(){
  const r = vendoRede(), irmas = REDE.filter(x => x.forania===r.forania && keyOf(x)!==keyOf(r));
  return `${inativaCard(r)}${minhaBtn()}${ativarHTML(r)}
  <h2>Forania ${esc(r.forania)}</h2><div class="list">${irmas.map(redeItem).join('')}</div>`;
}
function inativaComunidadesHTML(){
  return `${inativaCard(vendoRede())}<div class="empty">Esta paróquia ainda não publica as comunidades por aqui.</div>${minhaBtn()}`;
}
function bindInativa(root){
  bindMinha(root);
  root.querySelector('#pedirAtiv')?.addEventListener('click', () => { S.pedidosAtivacao.push(S.vendo); save(); render(); toast('Pedido de ativação registrado'); });
}

/* ---------- acesso ao painel (login) ---------- */
const svgOlho = p => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const OLHO = { // fechado = senha oculta; aberto = senha visível
  fechado: svgOlho('<path d="M3 3l18 18"/><path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c6 0 9.5 7 9.5 7a16.6 16.6 0 0 1-2.6 3.5M6.6 6.6A16.3 16.3 0 0 0 2.5 12S6 19 12 19a9.4 9.4 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'),
  aberto: svgOlho('<path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>')
};
function acessoHTML(){
  if (NUVEM.estado === 'carregando') return `<div class="status" role="status" style="margin-top:20px"><span class="spinner"></span>Conectando ao painel da paróquia…</div>`;
  if (NUVEM.estado === 'semConexao') return `<h2>Sem conexão</h2><div class="block"><p style="margin:0 0 10px">Não foi possível conectar ao banco da paróquia. Confira a internet e tente de novo.</p><button class="btn" id="acTentar">Tentar de novo</button></div>`;
  if (NUVEM.estado === 'semVinculo') return `<h2>Acesso ainda não liberado</h2><div class="block"><p style="margin:0 0 10px">O usuário <b>${esc(NUVEM.sessao?.user?.email)}</b> entrou, mas ainda não está vinculado a nenhuma paróquia. Peça ao responsável pelo sistema para liberar o acesso.</p><button class="btn ghost" id="acSair">Sair</button></div>`;
  return `<h2>Entrar no painel</h2>
  <p class="lead small">Acesso da equipe da paróquia: padre, secretaria e PASCOM. Os fiéis usam a página da paróquia, sem login.</p>
  <form class="block" id="loginF">
    <div class="field"><label for="l-em">E-mail</label><input type="email" id="l-em" name="email" autocomplete="username" required></div>
    <div class="field"><label for="l-pw">Senha</label><div class="pw"><input type="password" id="l-pw" name="senha" autocomplete="current-password" required><button type="button" class="pw-toggle" id="l-olho" aria-label="Mostrar senha" aria-controls="l-pw" aria-pressed="false">${OLHO.fechado}</button></div></div>
    <button class="btn block-w" id="l-btn">Entrar</button>
    <p class="small" id="l-err" role="alert" style="color:var(--danger);margin:8px 0 0"></p>
  </form>
  <button class="btn ghost block-w" id="acPub">Ver a página da paróquia</button>`;
}
function bindAcesso(root){
  root.querySelector('#acTentar')?.addEventListener('click', () => location.reload());
  root.querySelector('#acSair')?.addEventListener('click', () => sair());
  root.querySelector('#acPub')?.addEventListener('click', () => { S.mode='publico'; S.vendo=S.minha; save(); render(); scrollTo(0,0); });
  const f = root.querySelector('#loginF'); if (!f) return;
  const pw = f.querySelector('#l-pw'), olho = f.querySelector('#l-olho');
  olho.addEventListener('pointerdown', e => e.preventDefault()); // não tira o foco nem fecha o teclado no celular
  olho.addEventListener('click', () => {
    const mostrar = pw.type === 'password', ini = pw.selectionStart, fim = pw.selectionEnd;
    pw.type = mostrar ? 'text' : 'password';
    olho.setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
    olho.setAttribute('aria-pressed', String(mostrar));
    olho.innerHTML = mostrar ? OLHO.aberto : OLHO.fechado;
    pw.focus();
    try { pw.setSelectionRange(ini ?? pw.value.length, fim ?? pw.value.length); } catch(e){}
  });
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = f.querySelector('#l-btn'), err = f.querySelector('#l-err');
    btn.disabled = true; btn.textContent = 'Entrando…'; err.textContent = '';
    try { await entrar(f.email.value.trim(), f.senha.value); }
    catch(x){
      btn.disabled = false; btn.textContent = 'Entrar';
      err.textContent = /invalid/i.test(x?.message||'') ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar agora. Confira a internet e tente de novo.';
      if (NUVEM.sessao && !NUVEM.parishId && NUVEM.estado === 'carregando'){ NUVEM.estado = 'semConexao'; render(); }
    }
  });
}

/* ---------- roteador ---------- */
function render(){
  if (!(S.mode==='painel' && S.tab==='comunicar')) { publicado = null; if (!removendo) avisoStatus = null; }
  renderHeader();
  if (S.mode==='painel' && NUVEM.ativo && !logado()){
    document.getElementById('tabs').innerHTML = '';
    const v = document.getElementById('view'); v.innerHTML = acessoHTML(); bindAcesso(v);
    return;
  }
  const validas = tabsFor().map(([k]) => k).concat(S.mode==='publico' ? Object.keys(SUBTELAS_PUB) : []);
  if (!validas.includes(S.mode==='painel'?S.tab:S.pubTab)) { if (S.mode==='painel') S.tab='comunicar'; else S.pubTab='igreja'; }
  if (S.mode==='publico' && !vendoAtiva() && !vendoRede()) S.vendo = ATIVA;
  renderTabs();
  const v = document.getElementById('view');
  const map = S.mode==='painel' ? {
    comunicar:[comunicarHTML,bindComunicar], agenda:[agendaAdmHTML,bindAgendaAdm], mensagens:[mensagensHTML,bindMensagens], intencoes:[intencoesHTML,bindIntencoes], pessoas:[pessoasHTML,bindPessoas],
    comunidades:[comunidadesAdmHTML,bindComunidadesAdm], uso:[usoHTML,()=>{}], ajustes:[ajustesHTML,bindAjustes]
  } : { avisos:[avisosPubHTML, r => { bindEventos(r); r.querySelector('#goVela').onclick = () => { S.pubTab='igreja'; velaStep='form'; save(); render(); scrollTo(0,0); }; }], igreja:[igrejaPubHTML, bindIgreja], noticias:[noticiasPubHTML, carregarNoticias], rezar:[() => rezaHTML() || igrejaPubHTML(), r => reza.k ? bindRezar(r) : bindIgreja(r)], assistir:[assistirHTML,bindAssistir], agenda:[agendaPubHTML,bindAgendaPub],
    comunidades:[comunidadesPubHTML,bindComunidadesPub], comunidade:[comunidadePubHTML,bindComunidadesPub],
    contato:[contatoPubHTML, r => { const b = r.querySelector('#buscaRede'); b?.addEventListener('input', () => { buscaRede = b.value; const pos=b.selectionStart; render(); const n=document.getElementById('buscaRede'); n.focus(); n.setSelectionRange(pos,pos); }); }] };
  if (S.mode==='publico'){
    const pickBind = r => r.querySelectorAll('[data-pick]').forEach(x => { if (!x.onclick) x.onclick = () => { S.vendo = x.dataset.pick; S.pubTab='igreja'; save(); render(); scrollTo(0,0); }; });
    map.escolher = [escolherHTML, bindEscolher];
    if (!vendoAtiva()){ map.avisos=[inativaAvisosHTML,bindInativa]; map.agenda=[inativaMissasHTML,()=>{}]; map.contato=[inativaContatoHTML,bindInativa]; map.comunidades=map.comunidade=[inativaComunidadesHTML,bindInativa]; }
    const [h,b] = map[S.pubTab]; v.innerHTML = h(); b(v); pickBind(v);
    v.querySelectorAll('[data-pub]').forEach(x => { if (!x.onclick) x.onclick = () => { S.pubTab = x.dataset.pub; save(); render(); scrollTo(0,0); }; });
    if (S.pubTab==='contato' && vendoAtiva()) bindMinha(v);
    return;
  }
  const [h,b] = map[S.tab];
  v.innerHTML = h(); b(v);
}
if (NUVEM.ativo && location.hash === '#painel') S.mode = 'painel';
S.pubTab = 'igreja'; // a página pública sempre abre na Home (Igreja)
render();
iniciarNuvem();
</script>
</body>
