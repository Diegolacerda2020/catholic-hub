<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central Paroquial — Paróquia Santo Antônio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F5B3F'/%3E%3Cpath d='M16 6v20M10 12h12' stroke='%23fff' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#18221D; --muted:#5B6A62; --line:#DCE3DF;
  --lit:#1F5B3F; --lit-soft:#E3EEE8; --gold:#A87A1C; --gold-soft:#F6EDD8; --danger:#A33A2B; --wa:#1E7D4F;
  --cta:#8A5F0E; --cta-ink:#FFFFFF;
  --serif:"Alegreya", Georgia, "Times New Roman", serif;
  --sans:"Alegreya Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101613; --surface:#18201C; --ink:#E8EEEA; --muted:#9DAEA5; --line:#2B3731;
    --lit:#5FB189; --lit-soft:#1F3229; --gold:#D9AE55; --gold-soft:#332A17; --danger:#E0806F; --wa:#5FB189;
    --cta:#E3B95C; --cta-ink:#1A1407;
  }
}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#18201C; --ink:#E8EEEA; --muted:#9DAEA5; --line:#2B3731;
  --lit:#5FB189; --lit-soft:#1F3229; --gold:#D9AE55; --gold-soft:#332A17; --danger:#E0806F; --wa:#5FB189;
    --cta:#E3B95C; --cta-ink:#1A1407;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--lit)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
img{max-width:100%;display:block}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

header.top{background:var(--lit);color:#fff;padding:16px 18px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.parish{font-family:var(--serif);font-size:1.4rem;font-weight:700;line-height:1.1;margin:0}
.sub{margin-top:5px;font-size:.9rem;opacity:.9}
.mode{display:flex;background:rgba(255,255,255,.15);border-radius:999px;padding:3px;flex-shrink:0}
.mode button{border:0;background:transparent;color:#fff;padding:6px 11px;border-radius:999px;font-size:.82rem;font-weight:500}
.mode button[aria-pressed="true"]{background:#fff;color:#1F5B3F}
.operator{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.88rem}
.operator select{width:auto;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35)}
.operator select option{color:#18221D}
#opUser{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.operator .op-sair{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:3px 10px;font-size:.82rem;flex-shrink:0}
.operator .sync{margin-left:auto;font-size:.8rem;opacity:.85;white-space:nowrap}

main{flex:1;padding:14px 14px 110px}
h2{font-family:var(--serif);font-size:1.3rem;margin:22px 4px 8px;font-weight:700}
h2:first-child{margin-top:4px}
h3{margin:0;font-size:1.05rem}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.lead{margin:0 4px 12px;color:var(--muted)}

.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.list > .row{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}
.list > .row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}

.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--lit);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--lit);border:1.5px solid var(--lit)}
.btn.gold{background:var(--gold);color:#fff}
.btn.wa{background:var(--wa);color:#fff}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:8px}
.btn.block-w{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.btn.done{background:var(--lit-soft);color:var(--lit)}
.chip{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--lit-soft);color:var(--lit)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.link-btn{border:0;background:none;color:var(--danger);font-size:.85rem;padding:4px}

input[type=text],input[type=tel],input[type=date],input[type=email],input[type=password],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:90px}
input:focus,textarea:focus,select:focus{border-color:var(--lit);outline:none}
.field{margin-bottom:12px}
.field label{display:block;font-weight:500;margin-bottom:4px;font-size:.92rem}
.pw{position:relative}
.pw input{padding-right:52px}
.pw-toggle{position:absolute;top:1.5px;right:1.5px;bottom:1.5px;width:46px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);border-radius:0 9px 9px 0;-webkit-tap-highlight-color:transparent}
.pw-toggle:hover{color:var(--ink)}
.hint{font-size:.82rem;color:var(--muted);margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;margin-bottom:12px}
.check input{margin-top:4px}

/* compor */
.composer textarea{min-height:120px;font-size:1.05rem}
.composer .actions{display:flex;gap:8px;margin-top:10px}
.composer .actions .btn:first-child{flex:1}
.status{display:flex;align-items:center;gap:10px;color:var(--muted);padding:6px 4px}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--lit)}
@media (prefers-reduced-motion:no-preference){.spinner{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}

.out{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.out-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px}
.out-head h3{font-size:.98rem}
.out-body{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.98rem}
.out-body[contenteditable="true"]{outline:none}
.out-body[contenteditable="true"]:focus{background:var(--lit-soft)}
.out-foot{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.card-prev{padding:12px 14px}
.card-prev img{border-radius:8px;border:1px solid var(--line);width:100%}
.publish-bar{background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;padding:18px 16px 16px;margin:18px 0 14px}
.btn.cta{background:var(--cta);color:var(--cta-ink);min-height:56px;padding:15px 20px;font-size:1.15rem;font-weight:700;letter-spacing:.01em;border-radius:12px;gap:10px;box-shadow:0 2px 0 rgba(0,0,0,.2),0 6px 16px rgba(120,85,15,.28)}
.btn.cta svg{width:22px;height:22px;flex-shrink:0}
.btn.cta:hover{filter:brightness(1.07)}
@media (prefers-reduced-motion:no-preference){.btn.cta:active{transform:translateY(1px)}}
.published{margin:4px 0 12px}
.published .t{font-size:1.1rem;font-weight:700}
.published .btn{margin-top:10px}

/* aviso público */
.notice{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.notice h3{font-family:var(--serif);font-size:1.25rem;line-height:1.2;margin:2px 0 6px}
.notice p{margin:0;white-space:pre-wrap}
.when{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.time{font-family:var(--serif);font-size:1.2rem;font-weight:700;color:var(--lit);min-width:96px}
.day-label{font-weight:700;padding:10px 16px 6px;background:var(--bg);border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}
.list > .day-label:first-child{border-top:0}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--serif);font-size:1.7rem;line-height:1}
.stat span{font-size:.8rem;color:var(--muted)}
table.week{width:100%;border-collapse:collapse;font-size:.92rem}
table.week th,table.week td{padding:9px 12px;text-align:left;border-top:1px solid var(--line)}
table.week th{font-weight:500;color:var(--muted);border-top:0}
table.week td.n{text-align:right;font-variant-numeric:tabular-nums}
table.week th.n{text-align:right}
.signal{border-radius:12px;padding:12px 14px;margin-bottom:10px;font-weight:500}
.signal.green{background:var(--lit-soft);color:var(--lit)}
.signal.red{background:#F7E4E0;color:var(--danger)}
.signal.wait{background:var(--gold-soft);color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .signal.red{background:#3A211C}}

.person .who{font-weight:700}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}

nav.tabs{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs button{flex:1;border:0;background:transparent;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.76rem;color:var(--muted);position:relative}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--lit);font-weight:700}
.badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--gold);color:#fff;font-size:.7rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:700}

.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:500;z-index:10;max-width:90%;text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
.empty{text-align:center;padding:22px 16px;color:var(--muted)}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.fold summary{padding:13px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.fold summary::after{content:"+";color:var(--muted)}
details.fold[open] summary::after{content:"–"}
details.fold .inner{padding:0 16px 14px}
[hidden]{display:none!important}
.parish-btn{border:0;background:none;color:inherit;padding:0;text-align:left;cursor:default}
.parish-btn.pick{cursor:pointer}
.parish-btn .caret{display:inline-block;font-size:.8em;opacity:.85;margin-left:4px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.18);font-family:var(--sans);vertical-align:middle}
.pick-row{width:100%;border:0;background:transparent;text-align:left;display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.list > .pick-row:first-child{border-top:0}
.pick-row .grow{flex:1;min-width:0}
.pick-row:hover{background:var(--lit-soft)}
.vela-hero{background:#141c17;color:#F4EEDF;border-radius:16px;padding:22px 18px;text-align:center;margin-bottom:10px}
.vela-hero h3{font-family:var(--serif);font-size:1.35rem;margin:10px 0 4px;color:#fff}
.vela-hero p{margin:0;color:#d9d2c0}
.vela-hero .btn{margin-top:14px}
.candle{width:44px;height:124px;margin:0 auto;position:relative}
.candle .wax{position:absolute;bottom:0;left:6px;width:32px;height:80px;border-radius:6px 6px 4px 4px;background:linear-gradient(90deg,#e4d9bf,#fffaf0 45%,#ddd1b4)}
.candle .wick{position:absolute;bottom:80px;left:21px;width:2px;height:8px;background:#3a2e22;border-radius:1px}
.candle .flame{position:absolute;bottom:86px;left:12px;width:20px;height:34px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;transform-origin:50% 90%;
  background:radial-gradient(ellipse at 50% 72%,#fffbe0 0%,#ffd766 32%,#ff9d24 62%,rgba(255,130,20,0) 72%);filter:drop-shadow(0 0 14px rgba(255,176,50,.75))}
.candle.big{transform:scale(1.35);margin:18px auto 14px}
@media (prefers-reduced-motion:no-preference){.candle .flame{animation:flick 1.7s ease-in-out infinite alternate}
  @keyframes flick{0%{transform:rotate(-2deg) scaleY(1)}35%{transform:rotate(2deg) scaleY(1.07)}70%{transform:rotate(-1deg) scaleY(.95)}100%{transform:rotate(1.5deg) scaleY(1.04)}}}
.prayer{font-family:var(--serif);font-size:1.12rem;line-height:1.55;font-style:italic;color:#F4EEDF;margin:14px 4px 0}
.video{position:relative;aspect-ratio:16/9;background:#0f1512;border-radius:10px;overflow:hidden;margin:10px 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:0;background:linear-gradient(135deg,#1F5B3F,#0f1512);color:#fff;font-weight:700}
.video .play span.tri{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:1.4rem}
.news-sec{font-size:.95rem;color:var(--muted);margin:14px 4px 8px;font-weight:700}
.notice.news{padding:0 0 14px;overflow:hidden}
.notice.news > *:not(a:first-child){margin-left:16px;margin-right:16px}
.news-img{width:100%;aspect-ratio:2/1;object-fit:cover;background:var(--line);margin-bottom:12px}
.notice.news > .news-meta:first-child{margin-top:14px}
.news-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip.neutro{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.notice.news h3{margin-top:8px}
.notice.news h3 a{color:inherit;text-decoration:none}
.notice.news h3 a:hover{text-decoration:underline}
.notice.news p{margin-top:0;white-space:normal}
.news-cta{display:inline-block;margin-top:10px;font-weight:700;text-decoration:none}
.news-cta:hover{text-decoration:underline}
.news-fonte{margin:4px 4px 12px}
.watch{background:linear-gradient(135deg,#1F5B3F,#0f1512);border-radius:12px;padding:16px;margin:10px 0 0;display:flex;flex-direction:column;gap:10px}
.watch .btn.live{background:#fff;color:#1F5B3F;min-height:48px;font-size:1.05rem}
.watch .btn.yt{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.65)}
.canal-acoes{display:flex;gap:8px;flex-wrap:wrap;flex-basis:100%}

/* MVP 2 */
input[type=time],input[type=url]{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.radio-row{display:flex;gap:6px 14px;flex-wrap:wrap}
.radio-row label{display:flex;gap:8px;align-items:center;font-size:.95rem}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;overflow:hidden}
.crumb + h2{margin-top:4px}
.crumb{border:0;background:none;color:var(--lit);font-weight:700;padding:2px 4px;margin:0 0 2px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .acoes{margin-top:6px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.filtros button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;color:var(--muted)}
.filtros button[aria-pressed="true"]{border-color:var(--lit);background:var(--lit-soft);color:var(--lit);font-weight:700}
.stats.cinco{grid-template-columns:repeat(auto-fit,minmax(94px,1fr))}
button.stat{text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;gap:4px}
.stats.cinco b{font-variant-numeric:lining-nums}
button.stat[aria-pressed="true"]{border-color:var(--lit);background:var(--lit-soft)}
.mais-item{width:100%;border:0;background:transparent;text-align:left;display:flex;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);color:inherit;position:relative}
.list > .mais-item:first-child{border-top:0}
.mais-item svg{width:24px;height:24px;color:var(--lit);flex-shrink:0}
.mais-item .grow{flex:1;min-width:0}
.mais-item .badge{position:static;margin-left:auto}
.team-list{display:grid;gap:10px;margin-top:12px}
.team-row{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.team-row:first-child{border-top:0}
.team-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--lit-soft);color:var(--lit);font-weight:800;flex:0 0 auto}
.team-row .grow{min-width:0}
.team-row b,.team-row span{overflow-wrap:anywhere}
.team-soon{margin-top:14px}
/* home Igreja */
.hoje{background:var(--lit);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:10px;position:relative;overflow:hidden}
.hoje .par{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.hoje h2{color:#fff;margin:6px 0 0;font-size:1.5rem}
.hoje .data{font-size:1.05rem;margin-top:2px}
.hoje .tempo{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.95rem}
.cor-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.85);flex-shrink:0}
.hoje .festa{margin-top:8px;background:rgba(255,255,255,.16);border-radius:10px;padding:6px 10px;font-weight:700}
.leituras{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 2px}
.leituras dt{color:var(--muted);font-size:.9rem}
.leituras dd{margin:0;font-weight:700}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.duo .block{margin:0}
.mini .k{display:block;font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.mini b{display:block;font-family:var(--serif);font-size:1.5rem;line-height:1.15;color:var(--lit)}
.rezar-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.rz{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:84px;color:inherit}
.rz .ic{font-size:1.4rem;line-height:1}
.rz b{font-size:1rem;line-height:1.2;margin-top:4px}
.rz span.small{color:var(--muted)}
.rz.vela{background:#141c17;color:#F4EEDF;border-color:#141c17}
.rz.vela span.small{color:#ffd766}
.cta-diz{background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;padding:16px;margin:14px 0 10px}
.cta-diz h3{font-family:var(--serif);font-size:1.25rem}
.cta-diz p{margin:4px 0 12px}
.participar-grid{display:grid;grid-template-columns:1fr;gap:8px;margin:2px 0 16px}
.participar-grid .acao{min-height:104px}
/* orações guiadas */
.oracao{font-family:var(--serif);font-size:1.12rem;line-height:1.55;margin:8px 0 0;white-space:pre-line}
.passos{margin:8px 0 0;padding-left:22px}
.passos li{margin-bottom:4px}
details.txt summary{cursor:pointer;color:var(--lit);font-weight:700;padding:4px 0}
.contador{display:flex;flex-direction:column;align-items:center;gap:10px;margin:14px 0 4px}
.contador .btn{min-height:64px;font-size:1.15rem;width:100%}
.contas{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.contas i{width:14px;height:14px;border-radius:50%;border:2px solid var(--lit);display:block}
.contas i.on{background:var(--lit)}
.progresso{font-size:.85rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
/* eventos */
.notice.evento .news-meta{margin-bottom:6px}
.ev-img{width:100%;border-radius:10px;margin:0 0 10px;border:1px solid var(--line)}
.cancelado{text-decoration:line-through;color:var(--muted)}
.stats.quatro{grid-template-columns:1fr 1fr}
.stats.quatro b{font-variant-numeric:lining-nums}
.mesnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.mesnav b{font-family:var(--serif);font-size:1.2rem;text-align:center}
.mesnav .btn{font-size:.8rem;padding:6px 8px}

/* =========================================================
   Painel responsivo (vale só com body.painel-app: painel logado ou modo demonstração).
   A página pública e a tela de login continuam iguais.
   celular  (até 767px):   barra inferior com 4 tarefas + Mais, uma coluna
   tablet   (768–1199px):  trilho lateral com ícone + nome de todas as áreas
   computador (1200px+):   menu lateral completo, conteúdo largo
   ========================================================= */
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.marca{display:none}
nav.tabs .so-lateral{display:none}
.sino{position:relative;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:2px 9px;font-size:.9rem;line-height:1.3;display:inline-flex;align-items:center;gap:5px}
.sino[aria-expanded="true"]{background:rgba(255,255,255,.18)}
.sino-n{background:var(--cta);color:var(--cta-ink);border-radius:999px;font-size:.72rem;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.sino-painel{position:fixed;right:12px;width:min(380px,calc(100vw - 24px));max-height:min(70vh,560px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.22);z-index:40}
.sino-painel h3{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 16px 6px;margin:0}
.sino-item{width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:11px 16px;color:inherit}
.sino-item:hover{background:var(--lit-soft)}
.sino-item .ic{font-size:1.2rem;line-height:1.2}
.sino-item.nao-visto b::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cta);margin-left:6px;vertical-align:middle}
.sino-vazio{padding:8px 16px 16px;color:var(--muted)}
/* avisos com ação (nova solicitação, erro com "Tentar novamente"): não bloqueiam a tela */
.avisos-box{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.aviso-toast{pointer-events:auto;width:100%;max-width:380px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--lit);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:12px 12px 12px 14px}
.aviso-toast.erro{border-left-color:var(--danger)}
.aviso-toast .at-l{display:flex;gap:10px;align-items:flex-start}
.aviso-toast .at-ic{font-size:1.25rem;line-height:1.2}
.aviso-toast .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.aviso-toast .at-x{border:0;background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;padding:0 4px}
.aviso-toast .at-acao{margin:8px 0 0 34px}
@media (prefers-reduced-motion:no-preference){.aviso-toast{animation:chega .3s ease-out}@keyframes chega{from{opacity:0;transform:translateY(10px)}}}

/* ---------- Início do painel ---------- */
.ini-data{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:4px 4px 0}
.ini-cab h2{margin:2px 4px 12px;font-size:1.55rem}
.ini-h{font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px}
.ini-s24{background:var(--surface);border:1.5px solid var(--lit);border-radius:16px;padding:16px;margin-bottom:10px}
.ini-s24.tem-novas{border-color:var(--cta);box-shadow:inset 5px 0 0 var(--cta)}
.ini-s24-cab{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ini-s24-cab h3{font-family:var(--serif);font-size:1.3rem;margin:2px 0 0}
.ini-s24-cab p{margin:2px 0 0}
.ini-s24 .s24-kicker{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--lit)}
.ini-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.ini-stats .stat{min-height:74px}
.ini-stats .stat.quente{border-color:var(--cta);background:var(--gold-soft)}
.ini-stats .stat.quente b{color:var(--cta)}
.ini-novas{list-style:none;margin:12px 0 0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ini-novas li + li{border-top:1px solid var(--line)}
.ini-nova{width:100%;border:0;background:transparent;text-align:left;display:flex;gap:10px;align-items:center;padding:10px 12px;color:inherit}
.ini-nova:hover{background:var(--lit-soft)}
.ini-nova .grow{flex:1;min-width:0}
.ini-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ini-card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;color:inherit;min-height:128px;min-width:0}
.ini-card:hover{border-color:var(--lit)}
.ini-card .ini-k{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ini-card .ini-v{font-family:var(--serif);font-size:1.9rem;line-height:1.05;color:var(--lit);font-variant-numeric:lining-nums}
.ini-card .ini-v.zero{color:var(--muted)}
.ini-card .ini-t{font-size:.92rem}
.ini-card .ini-l{display:block;font-size:.88rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ini-card .ini-go{margin-top:auto;padding-top:6px;font-size:.88rem;font-weight:700;color:var(--lit)}
.ini-card.alerta{border-color:var(--cta)}
.ini-card.alerta .ini-v{color:var(--cta)}
.ini-card.largo{grid-column:1/-1}
.ini-prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 2px}
.ini-prog i{display:block;height:100%;background:var(--lit);border-radius:99px}
.ini-rapidas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ini-rapidas .btn{justify-content:flex-start;text-align:left;min-height:52px;gap:10px}
.notif-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--lit);border-radius:14px;padding:14px 16px;margin:10px 0}
.notif-card p{margin:4px 0 0}
@media (max-width:359px){.ini-cards,.ini-rapidas{grid-template-columns:1fr}}
@media (max-width:767px){.ini-data{display:none}} /* no celular a data já está no cabeçalho */
@media (min-width:600px){.ini-stats{grid-template-columns:repeat(4,1fr)}}

@media (min-width:768px){
  html:has(body.painel-app){scroll-padding-top:76px}
  body.painel-app{--topo:64px;--lateral:100px}
  body.painel-app .app{max-width:none;border:0;display:grid;grid-template-columns:var(--lateral) minmax(0,1fr);grid-template-rows:var(--topo) 1fr;min-height:100vh}
  body.painel-app header.top{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:14px;padding:0 20px;height:var(--topo);position:sticky;top:0;z-index:20}
  body.painel-app .top-row{display:contents}
  body.painel-app .top-row > div:first-child{min-width:0;flex:0 1 auto}
  body.painel-app .marca{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85;font-weight:700;margin-bottom:1px}
  body.painel-app .parish{font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;display:block}
  body.painel-app .sub{display:none}
  body.painel-app .operator{order:1;flex:1;margin:0;justify-content:flex-end;min-width:0}
  body.painel-app #opUser{flex:0 1 auto}
  body.painel-app .operator .sync{margin-left:0;order:-1}
  body.painel-app .mode{order:2}
  body.painel-app nav.tabs{grid-column:1;grid-row:2;position:sticky;top:var(--topo);bottom:auto;left:auto;right:auto;height:calc(100vh - var(--topo));max-width:none;margin:0;flex-direction:column;justify-content:flex-start;gap:2px;border-top:0;border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px;z-index:4}
  body.painel-app nav.tabs .so-lateral{display:flex}
  body.painel-app nav.tabs .so-barra{display:none}
  body.painel-app nav.tabs button{flex:0 0 auto;width:100%;border-radius:10px;padding:9px 4px;font-size:.74rem;line-height:1.15;text-align:center}
  body.painel-app nav.tabs button:hover{background:var(--bg);color:var(--ink)}
  body.painel-app nav.tabs button[aria-current="page"]{background:var(--lit-soft);color:var(--lit)}
  body.painel-app nav.tabs .badge{top:4px;left:calc(50% + 8px)}
  body.painel-app main{grid-column:2;grid-row:2;min-width:0;padding:22px max(24px,calc((100% - 1400px) / 2)) 48px}
  body.painel-app #voltaMais{display:none}
  body.painel-app main .composer,body.painel-app main .out,body.painel-app main .publish-bar,body.painel-app main form.block,body.painel-app main .lead{max-width:860px}
  body.painel-app .stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  body.painel-app .stats.quatro{grid-template-columns:repeat(4,1fr)}
  body.painel-app .toast{bottom:24px}
  body.painel-app .avisos-box{left:auto;bottom:24px;right:24px;width:380px}
  .ini-cards{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
}
@media (min-width:1200px){
  body.painel-app{--lateral:232px}
  body.painel-app nav.tabs{padding:14px 12px}
  body.painel-app nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 14px;font-size:.98rem;text-align:left}
  body.painel-app nav.tabs svg{width:22px;height:22px;flex-shrink:0}
  body.painel-app nav.tabs .badge{position:static;margin-left:auto;font-size:.76rem;min-width:22px;height:22px;border-radius:11px}
  body.painel-app nav.tabs .nav-destaque:not([aria-current="page"]){color:var(--ink);font-weight:700}
  .ini-grade{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0 24px;align-items:start}
  .ini-rapidas{grid-template-columns:1fr}
  .ini-colunas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px;align-items:start}
}

/* =========================================================
   Página pública: ações da Home, evento de hoje, destaques litúrgicos, Sala das Velas, Agenda, diretório
   ========================================================= */
.acoes-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 12px}
.acoes-grid .acao:last-child:nth-child(odd){grid-column:1/-1}
.acao{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:96px;color:inherit}
.acao:hover{border-color:var(--lit)}
.acao .ic{font-size:1.5rem;line-height:1}
.acao b{font-size:1.02rem;line-height:1.2;margin-top:4px;color:var(--lit)}
.acao .small{color:var(--muted);line-height:1.3}
.hoje-ev{background:var(--lit);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:10px}
.hoje-ev h3{font-family:var(--serif);font-size:1.35rem;margin:0 0 4px;color:#fff}
.hoje-ev-q{font-size:1.02rem;margin-bottom:12px}
.hoje-ev .btn{background:#fff;color:#1F5B3F}
.selo-demo{font-weight:500;letter-spacing:.02em}
.hoje-ev .selo-demo{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.5)}
.destaque{background:var(--gold-soft);border:1px solid var(--gold);border-radius:16px;padding:16px 18px;margin:14px 0 10px}
.destaque-k{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.destaque h3{font-family:var(--serif);font-size:1.35rem;margin:4px 0 2px}
.destaque p{margin:0}
.destaque .acoes{margin-top:12px}
.devocao .destaque-k{margin:4px 4px 0}
.devocao h2{margin-top:2px}
.tempo-lit{display:flex;align-items:center;gap:8px;margin-top:6px;font-weight:700;font-size:1.05rem}
/* Sala das Velas: capela escura, arco, prateleiras do altar e um brilho que cresce com o número REAL de velas */
.sala{--brilho:.3;position:relative;overflow:hidden;color:#F4EEDF;text-align:center;margin-bottom:10px;padding:34px 18px 26px;
  border-radius:46% 46% 18px 18px/110px 110px 18px 18px;border:1px solid #3b2f22;
  background:radial-gradient(ellipse 70% 46% at 50% 52%,rgba(255,176,72,calc(.06 + var(--brilho) * .3)),transparent 70%),linear-gradient(180deg,#221a13 0%,#15110d 55%,#0d0a08 100%)}
.sala::before{content:"";position:absolute;inset:10px 10px auto;height:100%;border:1px solid rgba(214,178,110,.18);border-bottom:0;border-radius:inherit;pointer-events:none}
.sala-cruz{display:block;width:26px;height:36px;margin:0 auto 6px;color:#d6b26e;opacity:.85}
.sala h2{color:#fff;margin:0;font-size:1.55rem;letter-spacing:.01em}
.sala-lema{margin:4px 0 14px;color:#e2d6bd;font-family:var(--serif);font-style:italic}
.sala-velas{--s:1;--k:1;display:flex;flex-direction:column;align-items:center;gap:calc(14px * var(--s));max-width:560px;margin:0 auto 18px;padding:6px 0 0}
.prateleira{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:calc(10px * var(--s) * var(--k));padding:0 calc(22px * var(--k)) 2px;min-width:min(100%, 240px);min-height:calc(56px * var(--s) * var(--k))}
.prateleira::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:7px;border-radius:2px;background:linear-gradient(180deg,#8a6038,#4d3219);box-shadow:0 6px 14px rgba(0,0,0,.55)}
.mv{position:relative;flex:0 0 auto;width:calc(14px * var(--s) * var(--k));height:calc(34px * var(--s) * var(--k));border-radius:3px 3px 2px 2px;background:linear-gradient(90deg,#e4d9c0,#f8f1e0 45%,#d9cba8)}
.mv i{position:absolute;left:50%;bottom:100%;width:calc(10px * var(--s) * var(--k));height:calc(16px * var(--s) * var(--k));transform:translateX(-50%);border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 72%,#fffbe0 0%,#ffd766 35%,#ff9d24 65%,rgba(255,130,20,0) 75%);filter:drop-shadow(0 0 calc(6px * var(--s)) rgba(255,190,80,.8));transform-origin:50% 90%}
.mv.apagada i{display:none}
.mv.apagada{opacity:.55}
@media (prefers-reduced-motion:no-preference){.mv i{animation:tremula 2.4s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
  @keyframes tremula{0%{transform:translateX(-50%) scale(1) rotate(-2deg);opacity:.92}50%{transform:translateX(-50%) scale(1.06,1.12) rotate(1.5deg);opacity:1}100%{transform:translateX(-50%) scale(.96,1.04) rotate(-1deg);opacity:.95}}}
.sala-n{font-family:var(--serif);font-size:1.25rem;margin:0 0 4px;color:#fff}
.sala-mais{margin:0 0 10px;color:#ffd766;font-weight:700}
.sala .btn{margin-top:10px;min-width:220px}
.sala-priv{margin:14px auto 0;max-width:460px;font-size:.88rem;color:#d9cdb3}
.sala-oracao{margin:14px auto 0;max-width:460px;font-family:var(--serif);font-style:italic;font-size:1.08rem;color:#f1dfb4}
/* Acesso rápido (subpáginas) */
.acesso-rapido{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 4px;scrollbar-width:none}
.acesso-rapido::-webkit-scrollbar{display:none}
.acesso-rapido .ar-t{flex:0 0 auto;align-self:center;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:2px}
.acesso-rapido button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:500;white-space:nowrap}
.acesso-rapido button:hover{border-color:var(--lit)}
.acesso-rapido button[aria-current="page"]{background:var(--lit);border-color:var(--lit);color:#fff}
/* Diretório: cartões */
.filtros-dir{margin-bottom:12px}
#buscaPar{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:1rem}
#buscaPar:focus{border-color:var(--lit);outline:none}
.boas-vindas{max-width:760px;margin:0 auto}
.boas-hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px;margin-bottom:14px}
.boas-hero .marca-publica{font-weight:700;color:var(--lit);margin-bottom:10px}
.boas-hero h2{font-size:1.75rem;margin:0 0 8px}
.boas-hero p{font-size:1.06rem;margin:0 0 16px}
.boas-busca label{display:block;font-weight:700;margin:0 0 6px}
.boas-busca input{min-height:54px;font-size:1.08rem}
.boas-opcoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.boas-opcoes .btn{min-height:46px}
.minha-faixa{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.minha-faixa b{display:block}
.minha-faixa .btn{flex-shrink:0}
.minha-faixa.outro{border-color:var(--gold);background:var(--gold-soft)}
.dir-grade{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px}
.dir-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dir-card.ativa{border-color:var(--lit)}
.dir-card .dir-nome{font-family:var(--serif);font-size:1.12rem;line-height:1.25}
.dir-card .dir-local{font-size:.92rem}
.dir-card .tagline{display:flex;flex-wrap:wrap;gap:6px}
.dir-card .dir-acao{margin-top:auto;padding-top:6px;display:flex;justify-content:flex-start}
.chip.santuario{background:#F3E6CC;color:#7A5418}
/* Contato da Central Paroquial: inclusão, ativação e rodapé discreto */
.cta-cp h3{font-family:var(--serif);font-size:1.2rem}
.cta-cp p{margin:6px 0 12px}
.cta-botoes{display:flex;flex-wrap:wrap;gap:8px}
.cta-botoes .btn{flex:1 1 200px;text-align:center}
.pub-rodape{margin:28px 4px 0;padding-top:14px;border-top:1px solid var(--line);font-size:.8rem;line-height:1.45;color:var(--muted);text-align:center}
.pub-rodape p{margin:0 auto 6px;max-width:640px}
.pub-rodape a{color:var(--lit);font-weight:500}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.santuario{background:#3d3020;color:#f0d9a8}}
/* Doações */
.cta-doa{margin-top:10px}
.doa-grade{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px;align-items:start}
.doa-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.doa-card h3{font-family:var(--serif);font-size:1.3rem}
.doa-qr{align-self:center;width:216px;max-width:100%;aspect-ratio:1;background:#fff;border-radius:12px;padding:8px;display:grid;place-items:center;border:1px solid var(--line)}
.doa-qr svg,.doa-qr img{width:100%;height:auto;display:block}
.doa-chave{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.doa-chave code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:.95rem}
.doa-nota{font-size:.88rem;color:var(--muted);margin:0}
.ag-dia{font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px}
.ag-sec{font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);margin:14px 4px 8px}
.ag-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ag-item b{flex:1 1 60%;min-width:0}
.ag-item .small{flex-basis:100%}
.ag-periodo{border-color:var(--gold)}

/* =========================================================
   Central Paroquial — protótipo 0.1
   Dados ficam neste aparelho (localStorage). Na versão

/* ---------- qual paróquia (tenant) ----------
   O mesmo código serve todas as paróquias ativas. A paróquia vem do endereço (?p=slug); senão, da
   "minha paróquia" guardada neste aparelho; senão, da paróquia padrão do config.js. Cada paróquia tem o
   próprio estado neste aparelho (nada de uma aparece na outra) e trocar de paróquia recarrega a página. */
const NAV_KEY = 'central-paroquial-navegacao'; // minha paróquia e recentes: valem para o aparelho, não para uma paróquia
const MINHA_PAROQUIA_KEY = 'central_paroquial_minha_paroquia';
const SLUG_OK = /^[a-z0-9]+(-[a-z0-9]+)*$/;
const PILOTO = (window.CENTRAL_CONFIG || {}).parishSlug || 'santo-antonio-jaragua';
function lerNav(){
  try {
    const n = JSON.parse(localStorage.getItem(NAV_KEY));
    const nav = n && typeof n === 'object' ? {minha:n.minha || null, recentes:Array.isArray(n.recentes) ? n.recentes.slice(0, 6) : []} : {minha:null, recentes:[]};
    const slug = localStorage.getItem(MINHA_PAROQUIA_KEY);
    if (!nav.minha && slug && SLUG_OK.test(slug)) nav.minha = {slug, tenant_slug:slug, active:true, rotulo:''};
    return nav;
  } catch(e){ return {minha:null, recentes:[]}; }
}

const TENANT = (() => {
  const p = new URLSearchParams(location.search).get('p');
  if (p && SLUG_OK.test(p)) return p;
  const m = lerNav().minha;
  return m?.tenant_slug && SLUG_OK.test(m.tenant_slug) ? m.tenant_slug : PILOTO;
})();

const E_PILOTO = TENANT === PILOTO; // só a paróquia piloto tem conteúdo inicial de exemplo

  tom:'acolhedor', emoji:true, assinatura:'Deus abençoe!', youtube:'', rec:{}, pix:''});

  'santo-antonio-jaragua': [{nome:'Santo Antônio', genero:'m', oracao:'santoAntonio'}],
  'nossa-senhora-das-gracas-ibirite': [{nome:'Nossa Senhora das Graças', genero:'f', oracao:'nossaSenhoraDasGracas'}],
  'santa-clara-e-sao-francisco-mineirao': [{nome:'Santa Clara', genero:'f'}, {nome:'São Francisco', genero:'m'}]
};
const limparTexto = v => String(v || '').trim();
function normalizarPatrono(p){
  if (typeof p === 'string') return {nome:limparTexto(p), genero:null, oracao:null};
  return {nome:limparTexto(p?.nome || p?.name), genero:p?.genero || p?.gender || null, oracao:p?.oracao || p?.prayer || null};
}
function generoPadroeiro(nome, genero){
  if (genero === 'f') return 'Nossa padroeira';
  if (genero === 'm') return 'Nosso padroeiro';
  return /^(Nossa Senhora|Santa)\b/i.test(nome) ? 'Nossa padroeira' : 'Nosso padroeiro';
}
function patronosParoquia(){
  const configurados = PATRONOS_TENANT[TENANT];
  const lista = configurados || (Array.isArray(S?.cfg?.patronos) ? S.cfg.patronos : (Array.isArray(S?.cfg?.patrons) ? S.cfg.patrons : (limparTexto(S?.cfg?.padroeiro) ? [S.cfg.padroeiro] : [])));
  return lista.map(normalizarPatrono).filter(p => p.nome).map((p, i) => ({...p, idx:i, rotulo:generoPadroeiro(p.nome, p.genero)}));
}
function seed(){

  const s = seedPiloto(t0);
  if (E_PILOTO) return s;

    modelos:{...s.modelos, aniversario:'Querido(a) {nome}, a {paroquia} celebra com você a graça de mais um ano de vida! Que Deus abençoe você e sua família. Feliz aniversário! 🎂🙏'}};
}
function seedPiloto(t0){
  return {
    mode:'painel', tab:'inicio', pubTab:'igreja', operador:'Secretaria',
    cfg:{
      nome:'Paróquia Santo Antônio – Jaraguá',
      padroeiro:'Santo Antônio',
      endereco:'Praça Santo Antônio, 2 – Jaraguá / Aeroporto – Belo Horizonte – MG, CEP 31270-860',
      telefone:'(31) 3427-2866',
      whats:'',
      email:'santoantoniopampulha@yahoo.com.br',
      paroco:'', // minimização: nome de responsável só se a própria paróquia cadastrar em Ajustes

    },
    pessoas:[
      {id:1,nome:'Maria das Graças Silva',whats:'31988887771',aniv:mmdd(t0),casamento:'',grupo:'dizimista',consent:true},
      {id:2,nome:'José e Ana Pereira',whats:'31988887772',aniv:mmdd(plusDays(40)),casamento:(t0.getFullYear()-15)+'-'+mmdd(t0),grupo:'dizimista',consent:true},
      {id:3,nome:'Carlos Mendes',whats:'31988887773',aniv:mmdd(plusDays(2)),casamento:'',grupo:'pastoral',consent:true},
      {id:4,nome:'Rosa Almeida',whats:'31988887774',aniv:mmdd(plusDays(5)),casamento:'',grupo:'dizimista',consent:true},
      {id:5,nome:'Joana Lima',whats:'31988887775',aniv:mmdd(plusDays(90)),casamento:'',grupo:'geral',consent:true},
      {id:6,nome:'Antônio Ferreira',whats:'31988887776',aniv:mmdd(plusDays(120)),casamento:'',grupo:'dizimista',consent:true}
    ],
    avisos:[
      {id:1,ts:now()-86400e3*2,titulo:'Quermesse de Santo Antônio',texto:'Barraquinhas, quadrilha e missa festiva no adro da Matriz. Traga a família!',evento:{titulo:'Quermesse de Santo Antônio',quando:'Sábado, 17h',onde:'Adro da Matriz'}},
      {id:3,ts:now()-86400e3*1,categoria:'igreja',link:'',titulo:'Setembro é o Mês da Bíblia',texto:'Neste mês, a Igreja no Brasil convida as comunidades a rezar e estudar a Palavra de Deus. Participe dos círculos bíblicos da paróquia.',evento:null},
      {id:2,ts:now()-86400e3*4,titulo:'Inscrições para a catequese',texto:'Estão abertas as inscrições para a catequese de 2027. Procure a secretaria paroquial com a certidão de batismo.',evento:null}
    ],
    intencoes:[
      {id:7,ts:now()-3600e3*5,tipo:'falecidos',por:'Sebastião Pereira (7º dia)',data:isoDay(plusDays(((7-t0.getDay())%7)||7)),hora:'10h',nome:'Família Pereira',whats:'31988887772',status:'nova'},
      {id:8,ts:now()-3600e3*20,tipo:'gracas',por:'Pelos 15 anos de casamento de José e Ana',data:isoDay(plusDays(((7-t0.getDay())%7)||7)),hora:'10h',nome:'Ana Pereira',whats:'',status:'confirmada'}
    ],
    draft:{texto:'',out:null,cardUrl:null,tipo:'paroquia',link:''},
    fila:{grupo:'dizimista',texto:'',abertos:[]},
    enviadosHoje:{dia:isoDay(t0),ids:[]},

    nextId:100

let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch(e){ S = seed(); }
const guardarLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const save = () => { guardarLocal(); nuvemAgendar(); };

/* ---------- banco compartilhado (Supabase) ----------
   Sem config.js preenchido, tudo fica só neste aparelho (modo demonstração).
   Com login, os dados da paróquia (COMPARTILHADO) vão para parish_state.data,
   que é praticamente o objeto S. Estado de tela (aba, rascunho, filtros,
   "minha paróquia") continua só no aparelho. */
const CONF = window.CENTRAL_CONFIG || {};
const COMPARTILHADO = ['cfg','modelos','pessoas','avisos','intencoes','velas','log','enviadosHoje'];
const PAPEIS = {padre:'Padre', secretaria:'Secretaria', pascom:'PASCOM', admin:'Suporte'};
const BASE_KEY = KEY+'-base';
const NUVEM = {
  ativo: !!(CONF.supabase?.url && CONF.supabase?.anonKey),
  slug: TENANT,
  sb:null, sessao:null, parishId:null, papel:null, estado:'off',
  base:null, baseTs:null, velasPub:null, timer:null, salvando:false, deNovo:false, renderPendente:false,
  equipe:{estado:'idle', parishId:null, itens:[]}
};
if (NUVEM.ativo) NUVEM.estado = 'carregando';
const clone = o => JSON.parse(JSON.stringify(o));
const igual = (a,b) => JSON.stringify(a) === JSON.stringify(b);
const compartilhado = () => Object.fromEntries(COMPARTILHADO.map(k => [k, S[k]]));
const logado = () => !!(NUVEM.sessao && NUVEM.parishId && NUVEM.baseTs);
const pendente = () => logado() && COMPARTILHADO.some(k => !igual(S[k], NUVEM.base[k]));

/* Junta o que mudou neste aparelho (local) com o que mudou em outro (remoto),
   a partir da última versão que os dois conheciam (base). Listas são juntadas
   item a item pelo id: um aviso publicado lá não apaga um publicado aqui. */
function juntar(base, local, remoto){
  if (remoto === undefined || igual(remoto, base)) return local;
  if (igual(local, base)) return remoto;
  const obj = v => v && typeof v === 'object' && !Array.isArray(v);
  if (Array.isArray(base) && Array.isArray(local) && Array.isArray(remoto)){
    const k = x => (obj(x) && 'id' in x) ? 'id:'+x.id : 'j:'+JSON.stringify(x);
    const B = new Map(base.map(x => [k(x), x])), L = new Map(local.map(x => [k(x), x])), R = new Set(remoto.map(k));
    const out = remoto.filter(x => !(B.has(k(x)) && !L.has(k(x))))                                   // apagado aqui
      .map(x => (B.has(k(x)) && L.has(k(x)) && !igual(L.get(k(x)), B.get(k(x)))) ? L.get(k(x)) : x); // alterado aqui
    local.forEach(x => { if (!B.has(k(x)) && !R.has(k(x))) out.push(x); });                          // novo aqui
    if (out.length && out.every(x => obj(x) && typeof x.ts === 'number')) out.sort((a,b) => a.ts-b.ts);
    return out;
  }
  if (obj(base) && obj(local) && obj(remoto)){
    const out = {};
    new Set([...Object.keys(local), ...Object.keys(remoto)]).forEach(p => {
      if (!(p in local) && (p in base)) return;
      const v = juntar(base[p], local[p], remoto[p]);
      if (v !== undefined) out[p] = v;
    });
    return out;
  }
  return local;
}
function inicialNuvem(){ const s = seed(); return {cfg:s.cfg, modelos:s.modelos, pessoas:[], avisos:[], intencoes:[], velas:[], log:[], enviadosHoje:s.enviadosHoje}; }
function gravarBase(){ try { localStorage.setItem(BASE_KEY, JSON.stringify({parishId:NUVEM.parishId, ts:NUVEM.baseTs, data:NUVEM.base})); } catch(e){} }
function lerBase(){ try { return JSON.parse(localStorage.getItem(BASE_KEY)); } catch(e){ return null; } }
function marcar(estado){
  NUVEM.estado = estado;
  const el = document.getElementById('syncSt'); if (!el) return;
  el.textContent = {salvando:'Salvando…', ok:'Salvo ✓', offline:'Sem internet: salvo só aqui', erro:'Erro ao salvar'}[estado] || '';
}
const digitando = () => { const a = document.activeElement; return !!(a && a.closest?.('#view') && (a.matches('input,textarea,select') || a.isContentEditable)); };
// Formulário do painel aberto (agenda, comunidade, dizimista): a sincronização espera ele fechar para não apagar o que foi digitado.
const editando = () => S.mode==="painel" && !!(comEdit || evEdit || dzEdit || acReg);
function renderSeguro(){ if (digitando() || editando()) { NUVEM.renderPendente = true; return; } NUVEM.renderPendente = false; render(); }
document.addEventListener('focusout', () => setTimeout(() => { if (NUVEM.renderPendente && !digitando()) renderSeguro(); }, 250));

function nuvemAgendar(){
  if (!logado()) return;
  clearTimeout(NUVEM.timer);
  NUVEM.timer = setTimeout(empurrar, 1200); // debounce: não salva a cada tecla
}
function aplicarRemoto(dados, ts){
  const inicial = inicialNuvem(), base = NUVEM.base;
  COMPARTILHADO.forEach(k => {
    const r = dados[k] ?? inicial[k];
    S[k] = base ? juntar(base[k], S[k], r) : clone(r); // sem base: descarta dados de demonstração do aparelho
  });
  NUVEM.base = clone(dados); NUVEM.baseTs = ts; gravarBase();
  normalizar(); guardarLocal();
}
async function puxar(){
  const {data, error} = await NUVEM.sb.from('parish_state').select('data, updated_at').eq('parish_id', NUVEM.parishId).single();
  if (error) throw error;
  if (NUVEM.base && data.updated_at === NUVEM.baseTs) return false;
  if (!data.data?.cfg){ // paróquia ainda vazia no banco: grava o conteúdo inicial
    const inicial = inicialNuvem();
    COMPARTILHADO.forEach(k => S[k] = clone(inicial[k]));
    NUVEM.base = data.data || {}; NUVEM.baseTs = data.updated_at; gravarBase();
    normalizar(); guardarLocal(); nuvemAgendar();
    return true;
  }
  aplicarRemoto(data.data, data.updated_at);
  return true;
}
async function empurrar(){
  if (!logado()) return;
  if (NUVEM.salvando){ NUVEM.deNovo = true; return; }
  if (!pendente()){ marcar('ok'); return; }
  NUVEM.salvando = true; marcar('salvando');
  try {
    for (let tentativa = 0; tentativa < 4; tentativa++){
      const dados = {...NUVEM.base, ...clone(compartilhado())};
      // Só grava se ninguém salvou desde a última leitura (updated_at igual).
      const {data, error} = await NUVEM.sb.from('parish_state').update({data:dados})
        .eq('parish_id', NUVEM.parishId).eq('updated_at', NUVEM.baseTs).select('updated_at');
      if (error) throw error;
      if (data.length){ NUVEM.base = dados; NUVEM.baseTs = data[0].updated_at; gravarBase(); marcar(pendente() ? 'salvando' : 'ok'); return; }
      if (!await puxar()) throw new Error('Sem permissão para salvar nesta paróquia');
      renderSeguro();
    }
    throw new Error('Muitas alterações ao mesmo tempo');
  } catch(e){
    console.warn('Central Paroquial: falha ao salvar', e);
    marcar(navigator.onLine === false ? 'offline' : 'erro');
  } finally {
    NUVEM.salvando = false;
    if (NUVEM.deNovo || pendente()){ NUVEM.deNovo = false; if (NUVEM.estado !== 'erro' && NUVEM.estado !== 'offline') nuvemAgendar(); }
  }
}

async function atualizar(){

/* ---------- MVP 2: comunidades, agenda e dizimistas (tabelas próprias) ----------
   Diferente do parish_state (um JSON só), estes dados ficam em tabelas com RLS no Supabase.
   Com login: lidos e gravados direto nas tabelas (e relidos a cada 15 s, como o resto).
   Página pública sem login: comunidades e eventos vêm de get_public_parish (S.pubRel).
   Modo demonstração: ficam em S.rel, só neste aparelho.
   Se o schema.sql novo ainda não foi rodado, REL.faltam diz quais tabelas faltam: só a tela que
   depende delas mostra o aviso de atualização, e o resto continua funcionando. */
const TABELA = {communities:'communities', events:'events', tithers:'tither_profiles', leads:'tither_leads', contribs:'tither_contributions'};
const REL = {communities:[], events:[], tithers:[], leads:[], contribs:[], faltam:new Set()};
const falta = k => NUVEM.ativo && REL.faltam.has(k);
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x' ? r : (r&3|8)).toString(16); });
const rel = k => NUVEM.ativo ? REL[k] : (S.rel[k] ||= []);
const tabelaFaltando = e => ['42P01','PGRST205','PGRST202','PGRST204'].includes(e?.code) || /does not exist|schema cache/i.test(e?.message||'');
// Matriz de acesso: espelha can_access() do schema.sql. As áreas que já existiam no piloto
// continuam abertas a toda a equipe nesta versão; dizimistas (dados pessoais) só padre e secretaria.
const ACESSO = {secretaria:['avisos','agenda','comunidades','dizimistas','pessoas','intencoes','mensagens','ajustes','secretaria24h','equipe'], pascom:['avisos','agenda','comunidades','noticias']};
const AREAS_ABERTAS = ['inicio','assistente','comunicar','mensagens','pessoas','intencoes','uso','ajustes','mais'];
const pode = area => !NUVEM.ativo || ['padre','admin'].includes(NUVEM.papel) || AREAS_ABERTAS.includes(area) || (ACESSO[NUVEM.papel]||[]).includes(area);
const AREA_TABELA = {communities:'comunidades', events:'agenda', tithers:'dizimistas', leads:'dizimistas', contribs:'dizimistas'};
// Contribuições: só os últimos 24 meses (o suficiente para a tela e o histórico).
const consulta = k => { const q = NUVEM.sb.from(TABELA[k]).select('*').eq('parish_id', NUVEM.parishId); return k === 'contribs' ? q.gte('reference_month', mesSoma(mesDe(new Date()), -24)) : q; };
async function relCarregar(){
  if (!logado()) return false;
  const ks = Object.keys(TABELA).filter(k => pode(AREA_TABELA[k]));
  const res = await Promise.all(ks.map(consulta));
  let mudou = false; const faltam = new Set();
  res.forEach(({data, error}, i) => {
    if (error){ if (tabelaFaltando(error)) faltam.add(ks[i]); else console.warn('Central Paroquial: falha ao ler '+ks[i], error); return; }
    if (!igual(REL[ks[i]], data)){ REL[ks[i]] = data; mudou = true; }
  });
  if (!igual([...REL.faltam], [...faltam])){ REL.faltam = faltam; mudou = true; }
  return mudou;
}
const semInternos = ({id, parish_id, created_at, updated_at, created_by, ...r}) => r;
function erroGravar(e, k){
  console.warn('Central Paroquial: falha ao gravar', e);
  if (tabelaFaltando(e)){ if (k) REL.faltam.add(k); return 'O banco ainda não foi atualizado para esta versão. Peça ao responsável para rodar o schema.sql.'; }
  if (e?.code === '42501') return 'Seu usuário não tem permissão para esta ação.';
  if (e?.code === '23505') return 'Já existe um cadastro com esse nome.';
  return navigator.onLine === false ? 'Sem internet. Tente de novo quando a conexão voltar.' : 'Não foi possível salvar. Tente de novo.';
}
// Grava (insere sem id, altera com id) e devolve o registro, ou null se falhar.
async function relGravar(k, obj){
  const agora = new Date().toISOString();
  if (!NUVEM.ativo){
    const l = rel(k), i = obj.id ? l.findIndex(x => x.id === obj.id) : -1;
    const r = i >= 0 ? {...l[i], ...obj, updated_at:agora} : {id:uuid(), parish_id:'demo', created_at:agora, updated_at:agora, ...obj};
    if (i >= 0) l[i] = r; else l.push(r);
    save(); return r;
  }
  if (!logado()) return null;
  const q = NUVEM.sb.from(TABELA[k]);
  const {data, error} = await (obj.id ? q.update(semInternos(obj)).eq('id', obj.id) : q.insert({...semInternos(obj), parish_id:NUVEM.parishId})).select().single();
  if (error){ toast(erroGravar(error, k)); return null; }
  const l = REL[k], i = l.findIndex(x => x.id === data.id);
  if (i >= 0) l[i] = data; else l.push(data);
  return data;
}
async function relExcluir(k, id){
  if (!NUVEM.ativo){ S.rel[k] = rel(k).filter(x => x.id !== id); save(); return true; }
  const {error} = await NUVEM.sb.from(TABELA[k]).delete().eq('id', id);
  if (error){ toast(erroGravar(error, k)); return false; }
  REL[k] = REL[k].filter(x => x.id !== id); return true;
}

function organizarLocal(texto){
  const c = S.cfg, t = texto.trim().replace(/\s+\n/g,'\n');
  let titulo = t.split(/[.!?\n]/)[0].trim();
  if (titulo.length > 50) titulo = titulo.split(/[,;:]/)[0].trim();
  if (titulo.length > 50) titulo = titulo.slice(0,47).replace(/\s\S*$/,'')+'…';
  titulo = titulo.charAt(0).toUpperCase() + titulo.slice(1);
  const corpo = t.charAt(0).toUpperCase() + t.slice(1);
  const dia = (t.match(/\b(hoje|amanhã|domingo|segunda(?:-feira)?|terça(?:-feira)?|quarta(?:-feira)?|quinta(?:-feira)?|sexta(?:-feira)?|sábado|dia \d{1,2}(?:\/\d{1,2})?)\b/i)||[])[0] || '';
  const hora = (t.match(/\b\d{1,2}(?:h\d{0,2}|:\d{2})\b/i)||[])[0] || '';
  const onde = (t.match(/\b(?:no|na|em)\s+((?:salão|igreja|matriz|capela|adro|quadra|centro)[^.,;!\n]*)/i)||[])[1] || '';
  const quando = [dia && dia[0].toUpperCase()+dia.slice(1), hora].filter(Boolean).join(', ');
  const e = c.emoji;
  const lk = S.draft.link ? `\n\n${e?'🔗 ':''}Saiba mais: ${S.draft.link}` : '';
  const whatsapp = `${e?(S.draft.tipo==='igreja'?'⛪ ':'📢 '):''}*${titulo}*\n\n${corpo}${quando?`\n\n${e?'🗓️ ':''}${quando}`:''}${onde?`\n${e?'📍 ':''}${onde}`:''}${lk}\n\n${c.assinatura}`;
  const tag = '#'+c.padroeiro.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z]/g,'');
  const instagram = `${titulo}${e?' ✨':''}\n\n${corpo}\n\n${c.nome}\n${tag} #paroquia #comunidade`;
  return {
    titulo, pagina:corpo, whatsapp, instagram,
    card:{titulo: titulo.length>48 ? titulo.slice(0,45).replace(/\s\S*$/,'')+'…' : titulo, quando, onde},
    evento: quando ? {titulo, quando, onde} : null,
    fonte:'basico'
  };
}

` : ''}Texto como a equipe escreveu:

Regras:

- "pagina": texto do aviso para a página pública, 1 a 3 frases, sem emoji.

- "instagram": legenda envolvente, termine com o nome da paróquia e até 3 hashtags.
- "card": título curto (até 45 caracteres), "quando" e "onde" só se estiverem no aviso (senão string vazia).
- "evento": se o aviso fala de algo com dia ou horário, preencha; caso contrário, null.

Responda somente com JSON neste formato:
{"titulo":"","pagina":"","whatsapp":"","instagram":"","card":{"titulo":"","quando":"","onde":""},"evento":{"titulo":"","quando":"","onde":""}}`;
  const r = await SAMPLE.json(prompt, {modelTier:'quick'});
  if (!r || !r.whatsapp || !r.titulo) throw {code:'invalid_json'};
  r.card = r.card || {titulo:r.titulo, quando:'', onde:''};
  if (r.evento && !r.evento.quando) r.evento = null;
  r.fonte = 'inteligente';
  return r;
}

/* card em imagem (canvas) */
function wrap(ctx, text, maxW){
  const words = String(text).split(/\s+/), lines = []; let line = '';
  for (const w of words){ const test = line ? line+' '+w : w; if (ctx.measureText(test).width > maxW && line){ lines.push(line); line = w; } else line = test; }
  if (line) lines.push(line); return lines;
}
async function gerarCard(card){
  try { await Promise.all([document.fonts.load('700 90px Alegreya'), document.fonts.load('500 40px "Alegreya Sans"')]); } catch(e){}
  const W=1080, H=1350, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const x=cv.getContext('2d');
  x.fillStyle='#1F5B3F'; x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(255,255,255,.12)'; x.lineWidth=3;
  x.beginPath(); x.arc(W-60, 140, 260, 0, Math.PI*2); x.stroke();
  x.beginPath(); x.arc(W-60, 140, 330, 0, Math.PI*2); x.stroke();
  x.fillStyle='#D9AE55'; x.fillRect(90,120,90,8);
  x.fillStyle='rgba(255,255,255,.85)'; x.font='500 40px "Alegreya Sans", sans-serif';
  x.fillText(S.cfg.nome, 90, 200);
  x.fillStyle='#FFFFFF';
  let size=104; x.font=`700 ${size}px Alegreya, Georgia, serif`;
  let lines = wrap(x, card.titulo, W-180);
  while (lines.length>5 && size>64){ size-=8; x.font=`700 ${size}px Alegreya, Georgia, serif`; lines = wrap(x, card.titulo, W-180); }
  let y = 420; lines.forEach(l => { x.fillText(l, 90, y); y += size*1.12; });
  y += 50;
  if (card.quando){ x.fillStyle='#D9AE55'; x.font='700 58px "Alegreya Sans", sans-serif'; wrap(x, card.quando, W-180).forEach(l=>{ x.fillText(l,90,y); y+=70; }); }
  if (card.onde){ x.fillStyle='rgba(255,255,255,.9)'; x.font='500 46px "Alegreya Sans", sans-serif'; wrap(x, card.onde, W-180).forEach(l=>{ x.fillText(l,90,y); y+=58; }); }
  x.fillStyle='rgba(255,255,255,.14)'; x.fillRect(0,H-150,W,150);
  x.fillStyle='rgba(255,255,255,.92)'; x.font='500 34px "Alegreya Sans", sans-serif';
  wrap(x, S.cfg.endereco, W-180).slice(0,2).forEach((l,i)=>x.fillText(l,90,H-92+i*42));
  return cv.toDataURL('image/png');
}

function bindComunicar(root){
  root.querySelector('#goAjustes')?.addEventListener('click', () => { S.tab='ajustes'; save(); render(); scrollTo(0,0); document.getElementById('c-mis')?.focus(); });
  const ta = root.querySelector('#txt');
  ta.addEventListener('input', () => { S.draft.texto = ta.value; save(); });
  root.querySelector('#verPub')?.addEventListener('click', () => { S.mode='publico'; S.vendo=ATIVA; S.pubTab = publicado.categoria==='igreja' ? 'igreja' : 'avisos'; publicado = null; save(); render(); scrollTo(0,0); });
  root.querySelectorAll('input[name=tipo]').forEach(r => r.onchange = () => { S.draft.tipo = r.value; S.draft.out = null; S.draft.cardUrl = null; save(); render(); });
  root.querySelectorAll('input[name=escopo]').forEach(r => r.onchange = () => { S.draft.scope = r.value; if (r.value==='community' && !comunidadeDe(S.draft.communityId)) S.draft.communityId = comunidadesAtivas()[0]?.id || null; save(); render(); });
  root.querySelector('#escCom')?.addEventListener('change', e => { S.draft.communityId = e.target.value; save(); });
  const lnk = root.querySelector('#lnk'); lnk?.addEventListener('input', () => { S.draft.link = lnk.value.trim(); save(); });
  root.querySelector('#btnLimpar')?.addEventListener('click', () => { S.draft = {texto:'',out:null,cardUrl:null,tipo:S.draft.tipo,link:''}; save(); render(); });
  root.querySelector('#btnOrg').addEventListener('click', async () => {
    const texto = ta.value.trim();
    if (texto.length < 10){ toast('Escreva o aviso com um pouco mais de detalhe.'); ta.focus(); return; }
    organizando = true; publicado = null; avisoStatus = null; S.draft.out = null; S.draft.cardUrl = null; render();
    let out;
    try { if (!SAMPLE) throw {code:'unavailable'}; out = await organizarInteligente(texto); }
    catch(e){ out = organizarLocal(texto); }
    organizando = false; S.draft.out = out; save();
    registrar('organizou', out.titulo);
    render();
    S.draft.cardUrl = await gerarCard(out.card); save();
    if (S.mode==='painel' && S.tab==='comunicar') render();
  });
  root.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (removendo || !confirm('Remover este aviso da página?')) return;
    const id = b.dataset.del, copia = clone(S.avisos.find(a => a.id == id));
    removendo = true; publicado = null; avisoStatus = {tipo:'wait', texto:'Removendo…'};
    S.avisos = S.avisos.filter(a => a.id != id); guardarLocal(); render();
    await salvarAgora();
    // Só confirma quando o banco já não tem o aviso (NUVEM.base = último estado confirmado pelo Supabase).
    const ok = !logado() ? !NUVEM.ativo : !(NUVEM.base.avisos || []).some(a => a.id == id);
    if (ok){ avisoStatus = {tipo:'green', texto:'✓ Aviso removido da página'}; if (!NUVEM.ativo) save(); }
    else {
      if (!S.avisos.some(a => a.id == id)) S.avisos.push(copia);
      guardarLocal(); avisoStatus = {tipo:'red', texto:'Não foi possível remover. Tente novamente.'};
    }
    removendo = false; render(); toast(avisoStatus.texto);
  });
  if (!S.draft.out) return;
  const o = S.draft.out;
  if (!S.draft.cardUrl && !organizando) gerarCard(o.card).then(u => { S.draft.cardUrl = u; save(); if (S.mode==='painel' && S.tab==='comunicar') render(); });
  root.querySelectorAll('[data-k]').forEach(el => el.addEventListener('input', () => { o[el.dataset.k] = el.innerText.trim(); save(); updWa(); }));
  const wa = root.querySelector('#waOpen');

  wa?.addEventListener('click', () => registrar('whatsapp-aviso', o.titulo));
  root.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => { copiar(o[b.dataset.copy]); registrar('copiou-'+b.dataset.copy, o.titulo); });
  root.querySelector('#cardDown')?.addEventListener('click', async () => {
    const blob = await (await fetch(S.draft.cardUrl)).blob();
    const nome = 'aviso-'+o.titulo.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,40)+'.png';
    await baixar(nome, blob);
  });
  root.querySelector('#btnPub')?.addEventListener('click', () => {
    const agenda = root.querySelector('#addAgenda');
    const com = S.draft.tipo!=='igreja' && S.draft.scope==='community' ? comunidadesAtivas().find(c => c.id===S.draft.communityId) : null;
    S.avisos.push({id:novoId(), ts:now(), categoria:S.draft.tipo, link:S.draft.tipo==='igreja'?S.draft.link:'', titulo:o.titulo, texto:o.pagina, evento:(o.evento && (!agenda || agenda.checked)) ? {titulo:o.evento.titulo||o.titulo, quando:o.evento.quando, onde:o.evento.onde||''} : null,
      scope:com ? 'community' : 'parish', communityId:com ? com.id : null});
    registrar('publicou', o.titulo);
    publicado = {titulo:o.titulo, categoria:S.draft.tipo, comunidade:com?.name}; avisoStatus = null;
    S.draft = {texto:'',out:null,cardUrl:null,tipo:S.draft.tipo,link:''}; save(); render(); scrollTo(0,0);
  });
}

function pendentesHoje(){
  const hoje = mmdd(new Date()), ano = new Date().getFullYear(), r = [];
  S.pessoas.forEach(p => {
    if (!p.consent || !p.whats) return;
    if (p.aniv === hoje) r.push({key:'aniv-'+p.id, tipo:'aniversario', p});
    if (p.casamento && p.casamento.slice(5) === hoje){ const anos = ano - Number(p.casamento.slice(0,4)); r.push({key:'bodas-'+p.id, tipo:'bodas', p, anos}); }
  });
  const vistos = new Set(r.map(x => x.tipo + digits(x.p.whats)));
  dizimistasHoje().forEach(x => { if (!vistos.has(x.tipo + x.p.whats)) r.push(x); });
  return r;
}
function proximos(dias){
  const r = [];
  for (let i=1;i<=dias;i++){ const d = plusDays(i), k = mmdd(d);
    S.pessoas.forEach(p => { if (p.consent && p.aniv===k) r.push({d, p, tipo:'Aniversário'}); if (p.consent && p.casamento && p.casamento.slice(5)===k) r.push({d, p, tipo:'Casamento'}); });
    rel('tithers').forEach(t => { if (t.status!=='active' || !t.consent || r.some(x => x.d===d && digits(x.p.whats)===t.whatsapp)) return; const p = {nome:t.name, whats:t.whatsapp};
      if (t.birth_date?.slice(5)===k) r.push({d, p, tipo:'Aniversário (dizimista)'}); if (t.marriage_date?.slice(5)===k) r.push({d, p, tipo:'Casamento (dizimista)'}); if (t.joined_on?.slice(5)===k && anosDesde(t.joined_on) > 0) r.push({d, p, tipo:'Aniversário de dízimo'}); }); }
  return r;
}
const GRUPOS = {dizimista:'Dizimistas', pastoral:'Agentes de pastoral', geral:'Paroquianos', todos:'Todos'};
function alvoGrupo(g){
  const r = S.pessoas.filter(p => p.consent && p.whats && (g==='todos' || p.grupo===g)).map(p => ({k:String(p.id), nome:p.nome, whats:p.whats}));
  if (g === 'dizimista' || g === 'todos'){
    const vistos = new Set(r.map(p => digits(p.whats)));
    rel('tithers').filter(t => t.status==='active' && t.consent && t.whatsapp && !vistos.has(t.whatsapp)).forEach(t => { vistos.add(t.whatsapp); r.push({k:'t'+t.id, nome:t.name, whats:t.whatsapp}); });
  }
  return r;
}

  const semana = now() - 7*86400e3;
  const L7 = S.log.filter(l => l.ts >= semana);
  const pubs = L7.filter(l=>l.acao==='publicou').length;
  const msgs = L7.filter(l=>l.acao.startsWith('mensagem')||l.acao==='whatsapp-aviso').length;
  const uteis = S.log.filter(l=>['publicou','mensagem-especial','mensagem-grupo','whatsapp-aviso'].includes(l.acao));
  const sem = uteis.filter(l=>l.op!=='Suporte').length;
  const pct = uteis.length ? Math.round(sem/uteis.length*100) : 0;
  const semanas = {}; uteis.forEach(l => { const k = semanaInicio(l.ts); (semanas[k] ||= {pub:0,msg:0,sup:0}); if (l.acao==='publicou') semanas[k].pub++; else semanas[k].msg++; if (l.op==='Suporte') semanas[k].sup++; });
  const ks = Object.keys(semanas).map(Number).sort((a,b)=>b-a).slice(0,6);
  const diasUso = new Set(L7.map(l=>new Date(l.ts).toDateString())).size;
  let sinal;
  if (!S.log.length) sinal = `<div class="signal wait">O teste começa quando a paróquia usar pela primeira vez.</div>`;
  else if (diasUso >= 3 && pct >= 70) sinal = `<div class="signal green">Sinal verde: uso em ${diasUso} dias desta semana, ${pct}% sem suporte.</div>`;
  else if (diasUso <= 1 && (now() - S.log[S.log.length-1].ts) > 5*86400e3) sinal = `<div class="signal red">Sinal vermelho: ninguém usa há mais de 5 dias.</div>`;
  else sinal = `<div class="signal wait">Em observação: uso em ${diasUso} dia${diasUso===1?'':'s'} desta semana, ${pct}% sem suporte.</div>`;
  return `<h2>Uso da Central</h2>
  <p class="lead small">Padre, secretaria e PASCOM veem o mesmo painel e podem fazer tudo. ${NUVEM.ativo ? 'Cada ação fica registrada com o papel de quem estava logado.' : 'A escolha "Usando agora" serve só para registrar quem fez cada ação.'} O que vale aqui é a paróquia usar sozinha.</p>
  ${sinal}
  <div class="stats">
    <div class="stat"><b>${pubs}</b><span>avisos publicados em 7 dias</span></div>
    <div class="stat"><b>${msgs}</b><span>mensagens no WhatsApp em 7 dias</span></div>
    <div class="stat"><b>${pct}%</b><span>feito sem suporte</span></div>
  </div>
  <h2>Por semana</h2>
  ${ks.length ? `<div class="list"><table class="week"><thead><tr><th>Semana de</th><th class="n">Avisos</th><th class="n">Mensagens</th><th class="n">Com suporte</th></tr></thead><tbody>
    ${ks.map(k=>{ const d=new Date(k), s=semanas[k]; return `<tr><td>${pad(d.getDate())}/${pad(d.getMonth()+1)}</td><td class="n">${s.pub}</td><td class="n">${s.msg}</td><td class="n">${s.sup}</td></tr>`; }).join('')}
  </tbody></table></div>` : '<div class="empty">Sem registros ainda.</div>'}
  <h2>Últimas ações</h2>
  ${S.log.length ? `<div class="list">${S.log.slice(-15).reverse().map(l=>`<div class="row"><div class="grow">${ACOES[l.acao]||l.acao}${l.extra?`<div class="small muted">${esc(l.extra)}</div>`:''}</div><div class="small muted" style="text-align:right">${esc(l.op==='Suporte'?'Suporte':l.op)}<br>${ago(l.ts)}</div></div>`).join('')}</div>` : '<div class="empty">Nada registrado.</div>'}`;
}

/* =========================================================
   7. AGENDA — eventos independentes dos avisos
   ========================================================= */
// Horários sempre no fuso da paróquia, qualquer que seja o fuso do aparelho.
const TZ = 'America/Sao_Paulo';
const FMT_SP = new Intl.DateTimeFormat('en-CA', {timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
const partesSP = iso => Object.fromEntries(FMT_SP.formatToParts(new Date(iso)).filter(p => p.type !== 'literal').map(p => [p.type, p.value]));
const diaSP = iso => { const p = partesSP(iso); return `${p.year}-${p.month}-${p.day}`; };
const horaSP = iso => { const p = partesSP(iso); return `${p.hour}:${p.minute}`; };
const horaBR = iso => { const [h, m] = horaSP(iso).split(':'); return +h + 'h' + (m === '00' ? '' : m); };
const isoSP = (dia, hora) => new Date(`${dia}T${hora || '00:00'}:00-03:00`).toISOString(); // Brasília sem horário de verão desde 2019
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function diaExtenso(dia){
  const [y, m, d] = dia.split('-').map(Number), dd = new Date(y, m-1, d);
  if (dia === isoDay(new Date())) return 'Hoje';
  if (dia === isoDay(plusDays(1))) return 'Amanhã';
  return `${cap(DIAS[dd.getDay()])}, ${d} de ${MESES[m-1]}${y !== new Date().getFullYear() ? ' de '+y : ''}`;
}
// fixo: sem "Hoje/Amanhã" (para textos que ficam gravados, como o aviso do evento)
function quandoEvento(e, fixo){
  const d = diaSP(e.starts_at), dx = fixo ? diaExtensoFixo : diaExtenso;
  const fim = !e.ends_at ? '' : diaSP(e.ends_at) === d ? ' às ' + horaBR(e.ends_at) : ' até ' + dx(diaSP(e.ends_at)).toLowerCase() + ', ' + horaBR(e.ends_at);
  return `${dx(d)} · ${horaBR(e.starts_at)}${fim}`;
}
const fimEvento = e => e.ends_at || new Date(Date.parse(e.starts_at) + 3600e3).toISOString(); // sem término: 1 hora
function localEvento(e){
  if (e.location) return e.location;
  const c = comunidadeDe(e.community_id);
  return c ? [c.name, c.address].filter(Boolean).join(', ') : [S.cfg.nome, S.cfg.endereco].filter(Boolean).join(', ');
}
function detalhesEvento(e){
  const c = comunidadeDe(e.community_id);
  return [e.description, `${c ? c.name + ' · ' : ''}${S.cfg.nome}`].filter(Boolean).join('\n\n');
}
// Google Agenda: link "adicionar evento" com fuso explícito (ctz). Não precisa de login nem de OAuth.
function googleAgendaUrl(e){
  const g = iso => { const p = partesSP(iso); return `${p.year}${p.month}${p.day}T${p.hour}${p.minute}00`; };
  const u = new URLSearchParams({action:'TEMPLATE', text:e.title, dates:g(e.starts_at)+'/'+g(fimEvento(e)), ctz:TZ, details:detalhesEvento(e), location:localEvento(e)});
  return 'https://calendar.google.com/calendar/render?' + u.toString();
}
// Arquivo .ics (iPhone, Outlook e outras agendas). Horários em UTC, válidos em qualquer fuso.
function icsEvento(e){
  const utc = iso => new Date(iso).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const t = s => String(s || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/[,;]/g, m => '\\' + m);
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Central Paroquial//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    'UID:' + e.id + '@central-paroquial', 'DTSTAMP:' + utc(new Date().toISOString()), 'DTSTART:' + utc(e.starts_at), 'DTEND:' + utc(fimEvento(e)),

  root.querySelectorAll('[data-ev-del]').forEach(b => b.onclick = async () => {
    const e = rel('events').find(x => x.id === b.dataset.evDel);

    if (img && !/^https:\/\//i.test(img)){ toast('O link da imagem precisa começar com https://'); f.image_url.focus(); return; }

    if (comunidade && !f.community_id.value){ toast('Escolha a comunidade.'); return; }
    const o = {title:titulo, description:f.description.value.trim(), starts_at:isoSP(f.dia.value, f.hi.value), ends_at:f.hf.value ? isoSP(f.dia.value, f.hf.value) : null,

      public:f.public.checked, highlight_home:f.highlight_home.checked, image_url:img || null};

  });
}

function bindDizimistas(root){
  bindInteressados(root); bindAcompanhamento(root);

  root.querySelectorAll('[data-dzf]').forEach(b => b.onclick = () => { dzFiltro = dzFiltro === b.dataset.dzf && b.classList.contains('stat') ? 'todos' : b.dataset.dzf; render(); });
  root.querySelector('[data-ir]')?.addEventListener('click', () => document.getElementById('interessados')?.scrollIntoView({behavior:'smooth'}));
  root.querySelector('#dzCom')?.addEventListener('change', e => { dzCom = e.target.value; render(); });
  const b = root.querySelector('#dzBusca');

  root.querySelectorAll('[data-send]').forEach(a => a.addEventListener('click', () => {
    if (!S.enviadosHoje.ids.includes(a.dataset.send)) S.enviadosHoje.ids.push(a.dataset.send);
    registrar('mensagem-dizimista', a.dataset.send.split('-')[1]); setTimeout(render, 300);
  }));
  root.querySelectorAll('[data-dz-msg]').forEach(a => a.addEventListener('click', () => registrar('mensagem-dizimista', 'agradecimento')));
  root.querySelector('#dzNovo')?.addEventListener('click', () => { dzEdit = {consent:true, status:'active', community_id:dzCom && dzCom !== 'sem' ? dzCom : null}; render(); scrollTo(0,0); document.getElementById('dz-nome')?.focus(); });
  root.querySelectorAll('[data-dz-edit]').forEach(x => x.onclick = () => { dzEdit = clone(rel('tithers').find(t => t.id === x.dataset.dzEdit)); render(); scrollTo(0,0); });
  root.querySelector('#dzVoltar')?.addEventListener('click', () => { dzEdit = null; render(); });
  root.querySelector('#dzExcluir')?.addEventListener('click', async () => {
    if (!confirm(`Excluir o cadastro de ${dzEdit.name}? Todos os dados dessa pessoa serão apagados e não dá para desfazer.`)) return;
    if (await relExcluir('tithers', dzEdit.id)){ registrar('excluiu-dizimista'); dzEdit = null; render(); toast('Cadastro excluído'); }
  });
  root.querySelector('#dzF')?.addEventListener('submit', async e => {
    e.preventDefault(); const f = e.target, nome = f.name.value.trim().replace(/\s+/g, ' '), wa = digits(f.whatsapp.value).replace(/^55(?=\d{10,11}$)/, '');

    if (wa && (wa.length < 10 || wa.length > 13)){ toast('Confira o WhatsApp com DDD.'); f.whatsapp.focus(); return; }
    if (f.consent.checked && !wa){ toast('Para enviar mensagens, informe o WhatsApp.'); f.whatsapp.focus(); return; }
    const outro = wa && rel('tithers').find(t => t.whatsapp === wa && t.id !== dzEdit.id);
    if (outro && !confirm(`${outro.name} já está cadastrado(a) com este WhatsApp. Salvar mesmo assim?`)) return;
    const o = {name:nome, whatsapp:wa, birth_date:f.birth_date.value || null, marriage_date:f.marriage_date.value || null, joined_on:f.joined_on.value || null,

    const r = await relGravar('tithers', o);
    if (!r){ btn.disabled = false; btn.textContent = 'Salvar'; return; }
