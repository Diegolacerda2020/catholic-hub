  });
}

/* ---------- Acompanhamento mensal do dízimo ----------
   Um registro em tither_contributions = "contribuição do mês registrada" (sem valor em dinheiro).
   Sem registro = "ainda não registrada". Nada de cobrança, nada enviado sozinho. */
let dzVista = 'cadastro', acMes = null, acFiltro = 'todos', acReg = null, acHist = null;
const mesDe = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-01`;
const mesSoma = (m, n) => { const [y, mm] = m.split('-').map(Number); return mesDe(new Date(y, mm - 1 + n, 1)); };
const rotuloMes = m => cap(MESES[+m.slice(5,7) - 1]) + ' ' + m.slice(0,4);
const mesBarra = m => MESES[+m.slice(5,7) - 1] + '/' + m.slice(0,4);
const fimMes = m => isoDay(new Date(+m.slice(0,4), +m.slice(5,7), 0));
const contribDe = (tid, m) => rel('contribs').find(c => c.tither_id === tid && c.reference_month === m);
const dataContrib = c => c.received_at ? dataCurta(diaSP(c.received_at)) : '';
// Ativos que já eram dizimistas naquele mês.
const ativosNoMes = m => rel('tithers').filter(t => t.status === 'active' && (!t.joined_on || t.joined_on <= fimMes(m))).sort(porNome);
function acompanhamentoHTML(){
  if (falta('contribs')) return `<h2>Acompanhamento do dízimo</h2>${migracaoHTML()}`;
  if (acReg) return contribFormHTML();
  if (acHist) return historicoHTML();
  const m = acMes ||= mesDe(new Date()), atual = mesDe(new Date());
  const ativos = ativosNoMes(m), reg = ativos.filter(t => contribDe(t.id, m)), nao = ativos.filter(t => !contribDe(t.id, m));
  const pct = ativos.length ? Math.round(reg.length / ativos.length * 100) : 0;
  const lista = acFiltro === 'registrados' ? reg : acFiltro === 'nao' ? nao : ativos;
  return `<h2>Acompanhamento do dízimo</h2>
  <div class="mesnav"><button class="btn sm ghost" data-acmes="-1" aria-label="Mês anterior: ${rotuloMes(mesSoma(m,-1))}">‹ ${rotuloMes(mesSoma(m,-1))}</button>
    <b aria-live="polite">${rotuloMes(m)}</b>
    <button class="btn sm ghost" data-acmes="1" aria-label="Próximo mês: ${rotuloMes(mesSoma(m,1))}">${rotuloMes(mesSoma(m,1))} ›</button></div>
  ${m !== atual ? `<p class="small muted" style="margin:-4px 4px 10px;text-align:center">${m > atual ? 'Este mês ainda não começou.' : 'Mês anterior.'} <button class="link-btn" style="color:var(--lit);padding:0" data-acmes="0">Voltar para ${rotuloMes(atual)}</button></p>` : ''}
  <div class="stats quatro">
    <div class="stat"><b>${ativos.length}</b><span>dizimistas ativos</span></div>
    <div class="stat"><b>${reg.length}</b><span>contribuições registradas</span></div>
    <div class="stat"><b>${nao.length}</b><span>ainda não registradas</span></div>
    <div class="stat"><b>${pct}%</b><span>registrado no mês</span></div>
  </div>
  <div class="filtros" role="group" aria-label="Filtrar">
    ${[['todos','Todos'],['registrados','Registrados'],['nao','Ainda não registrados']].map(([k,l]) => `<button data-acf="${k}" aria-pressed="${acFiltro===k}">${l}</button>`).join('')}</div>
  ${lista.length ? `<div class="list">${lista.map(t => { const c = contribDe(t.id, m), com = comunidadeDe(t.community_id);
    return `<div class="row" style="align-items:flex-start"><div class="grow"><b>${esc(t.name)}</b><div class="small muted">${esc(com?.name || 'Matriz')}</div>
      ${c ? `<div style="margin-top:6px">✅ Contribuição registrada${dataContrib(c) ? ` <span class="small muted">· ${dataContrib(c)}</span>` : ''}</div>${c.notes ? `<div class="small muted">${esc(c.notes)}</div>` : ''}`
           : '<div class="muted" style="margin-top:6px">○ Contribuição ainda não registrada</div>'}
      <div class="acoes">${c ? `<button class="btn sm ghost" data-ac-corr="${t.id}">Corrigir</button>` : `<button class="btn sm" data-ac-reg="${t.id}">Marcar como registrada</button>`}
        <button class="btn sm ghost" data-ac-hist="${t.id}">Ver histórico</button></div></div></div>`; }).join('')}</div>`
    : `<div class="empty">${!ativos.length ? 'Nenhum dizimista ativo neste mês.' : acFiltro === 'nao' ? 'Todas as contribuições do mês estão registradas.' : 'Nenhuma contribuição registrada neste mês ainda.'}</div>`}
  <p class="small muted" style="margin:10px 4px">Registro simples, sem valores, só para o acompanhamento pastoral. Nenhuma mensagem é enviada a partir desta tela.</p>`;
}
function contribFormHTML(){
  const t = rel('tithers').find(x => x.id === acReg.tither_id), c = acReg.id ? rel('contribs').find(x => x.id === acReg.id) : null, m = acReg.mes;
  const hoje = isoDay(new Date()), padrao = c?.received_at ? diaSP(c.received_at) : (hoje >= m && hoje <= fimMes(m) ? hoje : m < hoje ? fimMes(m) : m);
  return `<h2>${c ? 'Corrigir registro' : 'Registrar contribuição'}</h2>
  <form class="block" id="acF">
    <p style="margin:0 0 12px">${c ? 'Contribuição' : 'Registrar contribuição'} de <b>${mesBarra(m)}</b> para:<br><b style="font-family:var(--serif);font-size:1.2rem">${esc(t?.name || '')}</b></p>
    <div class="field"><label for="ac-data">Data</label><input type="date" id="ac-data" name="data" required value="${padrao}"></div>
    <div class="field"><label for="ac-obs">Observação</label><input type="text" id="ac-obs" name="obs" maxlength="500" placeholder="Opcional" value="${esc(c?.notes || '')}"><div class="hint">Não anote valores.</div></div>
    <div style="display:flex;gap:8px"><button type="button" class="btn ghost" id="acCancelar">Cancelar</button><button class="btn" style="flex:1" id="acSalvar">${c ? 'Salvar' : 'Registrar'}</button></div>
    ${c ? '<div style="text-align:center;margin-top:12px"><button type="button" class="link-btn" id="acDesfazer">Desfazer este registro</button></div>' : ''}
  </form>`;
}
function historicoHTML(){
  const t = rel('tithers').find(x => x.id === acHist); if (!t) { acHist = null; return acompanhamentoHTML(); }
  const atual = mesDe(new Date()), inicio = t.joined_on ? mesDe(new Date(+t.joined_on.slice(0,4), +t.joined_on.slice(5,7) - 1, 1)) : null;
  const meses = Array.from({length:12}, (_, i) => mesSoma(atual, -i)).filter(m => !inicio || m >= inicio);
  const anos = {}; meses.forEach(m => (anos[m.slice(0,4)] ||= []).push(m));
  return `<button class="crumb" id="acVoltaHist">‹ Acompanhamento</button>
  <h2>Histórico</h2>
  <div class="block"><b style="font-family:var(--serif);font-size:1.2rem">${esc(t.name)}</b>${t.joined_on ? `<div class="small muted">Dizimista desde ${dataCurta(t.joined_on).slice(3)}</div>` : ''}</div>
  ${Object.keys(anos).sort().reverse().map(a => `<h3 style="margin:14px 4px 6px">${a}</h3><div class="list">${anos[a].map(m => { const c = contribDe(t.id, m);
    return `<div class="row"><div class="grow">${cap(MESES[+m.slice(5,7) - 1])}</div><span>${c ? `✅ <span class="small muted">${dataContrib(c)}</span>` : '<span class="muted" aria-label="não há contribuição registrada">—</span>'}</span></div>`; }).join('')}</div>`).join('')}
  <p class="small muted" style="margin:10px 4px">✅ contribuição registrada · — não há contribuição registrada</p>`;
}
function bindAcompanhamento(root){
  root.querySelectorAll('[data-acmes]').forEach(b => b.onclick = () => { acMes = b.dataset.acmes === '0' ? mesDe(new Date()) : mesSoma(acMes, +b.dataset.acmes); render(); });
  root.querySelectorAll('[data-acf]').forEach(b => b.onclick = () => { acFiltro = b.dataset.acf; render(); });
  root.querySelectorAll('[data-ac-reg]').forEach(b => b.onclick = () => {
    if (acMes > mesDe(new Date()) && !confirm(`${rotuloMes(acMes)} ainda não começou. Registrar mesmo assim?`)) return;
    acReg = {tither_id:b.dataset.acReg, mes:acMes}; render(); scrollTo(0,0); });
  root.querySelectorAll('[data-ac-corr]').forEach(b => b.onclick = () => { const c = contribDe(b.dataset.acCorr, acMes); if (c){ acReg = {tither_id:c.tither_id, mes:acMes, id:c.id}; render(); scrollTo(0,0); } });
  root.querySelectorAll('[data-ac-hist]').forEach(b => b.onclick = () => { acHist = b.dataset.acHist; render(); scrollTo(0,0); });
  root.querySelector('#acVoltaHist')?.addEventListener('click', () => { acHist = null; render(); });
  root.querySelector('#acCancelar')?.addEventListener('click', () => { acReg = null; render(); });
  root.querySelector('#acDesfazer')?.addEventListener('click', async () => {
    if (!confirm(`Remover o registro de contribuição de ${mesBarra(acReg.mes)}?`)) return;
    if (await relExcluir('contribs', acReg.id)){ registrar('removeu-contribuicao', mesBarra(acReg.mes)); toast('Registro removido. O cadastro do dizimista continua.'); }
    acReg = null; render();
  });
  root.querySelector('#acF')?.addEventListener('submit', async e => {
    e.preventDefault(); const f = e.target;
    if (!f.data.value){ toast('Informe a data.'); return; }
    const o = {received_at:isoSP(f.data.value, '12:00'), notes:f.obs.value.trim() || null};
    if (acReg.id) o.id = acReg.id;
    else {
      if (contribDe(acReg.tither_id, acReg.mes)){ toast('Esta contribuição já está registrada.'); acReg = null; render(); return; }
      Object.assign(o, {tither_id:acReg.tither_id, reference_month:acReg.mes});
    }
    const btn = f.querySelector('#acSalvar'); btn.disabled = true; btn.textContent = 'Salvando…';
    const r = await relGravar('contribs', o);
    if (!r){ if (NUVEM.ativo) await relCarregar().catch(() => {}); acReg = null; render(); return; } // ex.: outro aparelho registrou antes
    registrar(acReg.id ? 'corrigiu-contribuicao' : 'registrou-contribuicao', mesBarra(acReg.mes));
    toast(acReg.id ? 'Registro corrigido' : `Contribuição de ${mesBarra(acReg.mes)} registrada`);
    acReg = null; render();
  });
}

/* ---------- "Quero ser dizimista": interessados vindos da página ---------- */
const PREF = {whatsapp:'Prefere WhatsApp', ligacao:'Prefere ligação', qualquer:'WhatsApp ou ligação'};
function quandoLead(iso){ const d = diaSP(iso); return d === isoDay(new Date()) ? 'Hoje' : d === isoDay(plusDays(-1)) ? 'Ontem' : dataCurta(d); }
function interessadosHTML(){
  const l = rel('leads').slice().sort((a,b) => Date.parse(b.created_at) - Date.parse(a.created_at));
  const abertos = l.filter(x => x.status === 'new' || x.status === 'contacted'), fechados = l.filter(x => !abertos.includes(x));
  const novos = abertos.filter(x => x.status === 'new').length;
  return `<h2 id="interessados">Novos interessados${novos ? ` <span class="chip gold">${novos} novo${novos===1?'':'s'}</span>` : ''}</h2>
  ${abertos.length ? `<div class="list">${abertos.map(x => { const c = comunidadeDe(x.community_id);
    const msg = `Olá, ${primeiroNome(x.name)}! Aqui é da ${S.cfg.nome}. Recebemos seu interesse em ser dizimista. Muito obrigado! Podemos conversar sobre como participar?`;
    return `<div class="row" style="align-items:flex-start"><div class="grow"><b>${esc(x.name)}</b>
      <div class="small muted">${[c?.name, quandoLead(x.created_at), PREF[x.contact_preference]].filter(Boolean).map(esc).join(' · ')}</div>
      ${x.status === 'contacted' ? '<span class="chip">Já contatado</span>' : '<span class="chip gold">Novo</span>'}
      <div class="acoes">
        <a class="btn sm wa" href="${waLink(x.whatsapp, msg)}" target="_blank" rel="noopener" data-lead-wa="${x.id}">Falar no WhatsApp</a>
        ${x.contact_preference !== 'whatsapp' ? `<a class="btn sm ghost" href="${telLink(x.whatsapp)}" data-lead-wa="${x.id}">Ligar</a>` : ''}
        <button class="btn sm" data-lead-conv="${x.id}">Converter em dizimista</button>
        <button class="btn sm ghost" data-lead-fim="${x.id}">Encerrar</button></div></div></div>`; }).join('')}</div>`
    : '<div class="empty">Nenhum interessado aguardando contato. Quando alguém tocar em “Quero ser dizimista” na página, aparece aqui.</div>'}
  ${fechados.length ? `<details class="fold"><summary>Histórico de interessados (${fechados.length})</summary><div class="list" style="margin:0 12px 12px">${fechados.map(x => `<div class="row"><div class="grow">${esc(x.name)}<div class="small muted">${quandoLead(x.created_at)} · ${x.status === 'converted' ? 'virou dizimista' : 'encerrado'}</div></div><button class="link-btn" data-lead-del="${x.id}">Apagar</button></div>`).join('')}</div></details>` : ''}`;
}
async function converterLead(x){
  if (!NUVEM.ativo){ // demonstração: mesma regra da função convert_tither_lead do banco
    let t = rel('tithers').find(t => t.whatsapp === x.whatsapp);
    t = t ? await relGravar('tithers', {id:t.id, status:'active'}) : await relGravar('tithers', {name:x.name, whatsapp:x.whatsapp, community_id:x.community_id, joined_on:isoDay(new Date()), status:'active', consent:x.consent, notes:null, birth_date:null, marriage_date:null});
    await relGravar('leads', {id:x.id, status:'converted', tither_id:t.id});
    return t;
  }
  const {data, error} = await NUVEM.sb.rpc('convert_tither_lead', {p_lead:x.id});
  if (error){ toast(erroGravar(error)); return null; }
  await relCarregar();
  return rel('tithers').find(t => t.id === data) || {id:data};
}
function bindInteressados(root){
  root.querySelectorAll('[data-lead-wa]').forEach(a => a.addEventListener('click', async () => {
    const x = rel('leads').find(l => l.id === a.dataset.leadWa);
    if (x?.status === 'new' && await relGravar('leads', {id:x.id, status:'contacted'})){ registrar('contatou-interessado'); setTimeout(render, 300); }
  }));
  root.querySelectorAll('[data-lead-conv]').forEach(b => b.onclick = async () => {
    const x = rel('leads').find(l => l.id === b.dataset.leadConv);
    if (!confirm(`Cadastrar ${x.name} como dizimista? Se o WhatsApp já estiver no cadastro, o cadastro existente é reativado.`)) return;
    b.disabled = true;
    const t = await converterLead(x);
    if (t){ registrar('converteu-interessado'); toast(`${primeiroNome(x.name)} agora é dizimista. Complete o cadastro quando puder.`); dzEdit = clone(rel('tithers').find(y => y.id === t.id) || null); scrollTo(0,0); }
    render();
  });

// Pix "copia e cola" (BR Code estático do Banco Central, sem valor): o fiel escolhe o valor no app do banco.
function crc16Pix(s){ let c = 0xFFFF; for (let i = 0; i < s.length; i++){ c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, '0'); }
function pixCopiaECola(p){
  const f = (id, v) => id + String(v.length).padStart(2, '0') + v;
  const limpa = (t, n) => semAcento(String(t || '')).toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, n);
  let chave = String(p.key || '').trim();
  if (p.key_type === 'cpf' || p.key_type === 'cnpj') chave = chave.replace(/\D/g, '');
  if (p.key_type === 'telefone'){ const d = chave.replace(/\D/g, ''); chave = '+' + (d.startsWith('55') && d.length > 11 ? d : '55' + d); }
  if (p.key_type === 'email') chave = chave.toLowerCase();
  const corpo = f('00', '01') + f('26', f('00', 'br.gov.bcb.pix') + f('01', chave)) + f('52', '0000') + f('53', '986') + f('58', 'BR')
    + f('59', limpa(p.beneficiary, 25) || 'N') + f('60', limpa(p.city, 15) || 'N') + f('62', f('05', '***')) + '6304';
  return corpo + crc16Pix(corpo);
}
// QR Code: biblioteca pequena, carregada só nesta tela. Sem ela (offline), fica o "copia e cola".
// Versão fixa + integridade (SRI): o navegador recusa o arquivo se ele for alterado no CDN.
const QR_LIB = {src:'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js', sri:'sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k'};
let qrCarregando = null;
const carregarQR = () => qrCarregando ||= new Promise((ok, falha) => {
  const s = document.createElement('script'); s.src = QR_LIB.src; s.integrity = QR_LIB.sri; s.crossOrigin = 'anonymous';
  s.onload = ok; s.onerror = () => { qrCarregando = null; falha(); }; document.head.appendChild(s);
});
async function desenharQR(texto){
  const alvo = () => document.getElementById('pixQR'); // a tela pode ter sido redesenhada enquanto carregava
  try {
    if (!window.qrcode) await carregarQR();
    const qr = window.qrcode(0, 'M'); qr.addData(texto); qr.make();
    const el = alvo(); if (el) el.innerHTML = qr.createSvgTag({cellSize:4, margin:2, scalable:true, alt:'QR Code Pix'});
  } catch(e){ const el = alvo(); if (el) el.innerHTML = '<span class="small muted" style="text-align:center;padding:10px">QR Code indisponível agora. Use o código Pix copia e cola abaixo.</span>'; }
}

function contatoBtn(){
  const c = S.cfg, msg = 'Olá! Vim pela página da '+c.nome+'.';
  if (!c.whats && !c.telefone) return '';
  return c.whats ? `<a class="btn wa block-w" href="${waLink(c.whats,msg)}" target="_blank" rel="noopener">Falar com a secretaria no WhatsApp</a>`
                 : `<a class="btn block-w" href="${telLink(c.telefone)}">Ligar para a secretaria ${esc(c.telefone)}</a>`;
}
function contatoPubHTML(){
  const c = S.cfg;
  if (!DIR.vizinhas && c.forania){
    DIR.vizinhas = [];
    buscarDiretorio(c.forania).then(l => { DIR.vizinhas = l.filter(x => x.forania === c.forania && x.tenant_slug !== TENANT && x.slug !== 'rede:' + PILOTO_REDE); if (S.mode === 'publico' && S.pubTab === 'contato') renderSeguro(); }).catch(() => {});
  }
  const dados = [c.telefone ? 'Telefone ' + esc(c.telefone) : '', c.email ? `E-mail <a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ''].filter(Boolean).join('<br>');
  return `<h2>${esc(c.nome || 'Paróquia')}</h2>

/* ---------- calendário litúrgico (calculado, sem manutenção) ---------- */
const DAY = 86400e3;
const dt = (y,m,d) => new Date(y,m-1,d);
const addD = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
function pascoa(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return dt(y,mo,da); }
function advento(y){ const n=dt(y,12,25), w=n.getDay(); return addD(n, -(w===0?7:w) - 21); }
function batismo(y){ let ep=dt(y,1,2); while (ep.getDay()!==0) ep=addD(ep,1); return ep.getDate()>=7 ? addD(ep,1) : addD(ep,7); }
function moveis(y){ const E=pascoa(y); return [
  [addD(E,-46),'Quarta-feira de Cinzas, início da Quaresma'],[addD(E,-7),'Domingo de Ramos'],[addD(E,-3),'Quinta-feira Santa'],
  [addD(E,-2),'Sexta-feira da Paixão'],[E,'Páscoa do Senhor'],[addD(E,49),'Pentecostes'],[addD(E,60),'Corpus Christi'],[advento(y),'1º Domingo do Advento']]; }
const FIXAS = [['01-01','Santa Maria, Mãe de Deus'],['02-02','Apresentação do Senhor'],['03-19','São José'],['03-25','Anunciação do Senhor'],
  ['06-13','Santo Antônio'],['06-24','Nascimento de São João Batista'],['06-29','São Pedro e São Paulo'],['08-06','Transfiguração do Senhor'],
  ['09-29','Santos Arcanjos Miguel, Gabriel e Rafael'],['10-01','Santa Teresinha do Menino Jesus'],['10-04','São Francisco de Assis'],
  ['10-12','Nossa Senhora Aparecida, Padroeira do Brasil'],['11-02','Fiéis Defuntos (Finados)'],['12-08','Imaculada Conceição'],
  ['12-12','Nossa Senhora de Guadalupe'],['12-25','Natal do Senhor']];
const DEVOCOES = [
  {de:'08-15', ate:'09-29', nome:'Quaresma de São Miguel', desc:'Quarenta dias de oração e penitência que terminam na festa de São Miguel Arcanjo.'},
  {de:'05-01', ate:'05-31', nome:'Mês de Maria', desc:'Mês dedicado a Nossa Senhora, com terços e coroações.'},
  {de:'08-01', ate:'08-31', nome:'Mês Vocacional', desc:'A Igreja no Brasil reza pelas vocações: sacerdotes, religiosos, família e leigos.'},
  {de:'09-01', ate:'09-30', nome:'Mês da Bíblia', desc:'Convite para rezar e estudar a Palavra de Deus.'},
  {de:'10-01', ate:'10-31', nome:'Mês Missionário', desc:'Tempo de rezar e colaborar com as missões da Igreja no mundo.'}];
function tempoLiturgico(d0){
  const d = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate()), y = d.getFullYear(), E = pascoa(y);
  if (d >= dt(y,12,25) || d <= batismo(y)) return {nome:'Tempo do Natal', cor:'branco'};
  if (d >= advento(y)) return {nome:'Tempo do Advento', cor:'roxo'};
  if (d >= addD(E,-46) && d < addD(E,-7)) return {nome:'Tempo da Quaresma', cor:'roxo'};
  if (d >= addD(E,-7) && d < addD(E,-3)) return {nome:'Semana Santa', cor:'roxo'};
  if (d >= addD(E,-3) && d < E) return {nome:'Tríduo Pascal', cor: d.getTime()===addD(E,-2).getTime() ? 'vermelho' : 'branco'};
  if (d >= E && d <= addD(E,49)) return {nome:'Tempo Pascal', cor: d.getTime()===addD(E,49).getTime() ? 'vermelho' : 'branco'};
  return {nome:'Tempo Comum', cor:'verde'};
}
const COR = {roxo:'#6B3E8E', branco:'#C9B88A', verde:'#2E7D4F', vermelho:'#B03A2E'};
function proximasDatas(n){
  const hoje = new Date(); hoje.setHours(0,0,0,0); const y = hoje.getFullYear(), r = [];
  [y, y+1].forEach(yy => { moveis(yy).forEach(([d,t]) => r.push([d,t])); FIXAS.forEach(([md,t]) => r.push([dt(yy, +md.slice(0,2), +md.slice(3)), t])); });
  return r.filter(([d]) => d >= hoje).sort((a,b)=>a[0]-b[0]).slice(0,n);
}
function devocoesAtivas(){
  const hoje = new Date(); hoje.setHours(0,0,0,0); const y = hoje.getFullYear();
  return DEVOCOES.map(v => ({...v, ini:dt(y,+v.de.slice(0,2),+v.de.slice(3)), fim:dt(y,+v.ate.slice(0,2),+v.ate.slice(3))})).filter(v => hoje >= v.ini && hoje <= v.fim);
}

const festaDoDia = d => FIXAS.find(([m]) => m===mmdd(d))?.[1] || moveis(d.getFullYear()).find(([x]) => x.toDateString()===d.toDateString())?.[1] || '';
// Próxima missa a partir de cfg.missas (inclui a regra da primeira sexta-feira do mês, via horariosDoDia).
function proximaMissa(){
  for (let i = 0; i < 8; i++){
    const d = plusDays(i);
    for (const h of horariosDoDia(d)){
      const [hh, mm] = h.split('h'), t = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hh, +(mm || 0));
      if (t.getTime() > now() - 15*60e3) return {t, i, hora: +hh + 'h' + (mm && mm !== '00' ? mm : '')}; // começou há menos de 15 min: ainda dá tempo
    }
  }
  return null;
}

function bindRezar(root){
  root.querySelectorAll('[data-rezar]').forEach(b => b.onclick = () => { reza = {k:b.dataset.rezar, passo:0, conta:0, misterios:null}; S.pubTab = 'rezar'; render(); scrollTo(0,0); });
  root.querySelector('#rzVela')?.addEventListener('click', () => { S.pubTab = 'velas'; velaStep = 'inicio'; save(); render(); scrollTo(0,0); });
  root.querySelectorAll('[data-mist]').forEach(b => b.onclick = () => { reza.misterios = b.dataset.mist; render(); });
  root.querySelector('#rzConta')?.addEventListener('click', e => { // só atualiza o contador, sem redesenhar a tela
    const c = oracaoGuiada(reza.k).passos[reza.passo].contador;
    if (reza.conta < c.n) reza.conta++;
    e.currentTarget.textContent = rotuloConta(c);
    root.querySelector('.contas').outerHTML = contasHTML(c);
  });
  root.querySelector('#rzVolta')?.addEventListener('click', () => { reza.passo--; reza.conta = 0; render(); scrollTo(0,0); });
  root.querySelector('#rzProx')?.addEventListener('click', () => {
    if (reza.passo >= oracaoGuiada(reza.k).passos.length - 1){ reza = {k:null, passo:0, conta:0, misterios:null}; S.pubTab = 'igreja'; render(); scrollTo(0,0); toast('Deus te abençoe! 🙏'); return; }
    reza.passo++; reza.conta = 0; render(); scrollTo(0,0);
  });
}

/* ---------- notícias automáticas da Arquidiocese de BH ----------
   Buscadas pelo Worker (/api/noticias), nunca direto do navegador: ele consulta a API/RSS
   do portal, guarda ~1 hora e, se a fonte cair, devolve o último resultado válido.
   Separadas das notícias que a paróquia publica manualmente. Onde não há Worker (GitHub Pages)
   ou se ele falhar, usa o espelho noticias.json que o GitHub Actions atualiza de hora em hora
   (branch "dados"). Se tudo falhar, a página segue funcionando e mostra só o link para o site. */
const ARQ_SITE = 'https://arquidiocesebh.org.br/noticias/';
const NOTICIAS_API = CONF.noticiasApi || (location.protocol === 'file:' || /\.github\.io$/.test(location.hostname) ? '' : '/api/noticias');
const NOTICIAS_ESPELHO = CONF.noticiasEspelho || 'https://raw.githubusercontent.com/Diegolacerda2020/catholic-hub/dados/noticias.json';
// O portal devolve o cabeçalho CORS com a origem de quem pediu e guarda isso em cache: sem a origem na URL,
// uma resposta guardada para outro site bloquearia a nossa. Com "cp=<nosso host>", cada site tem a sua entrada.
const NOTICIAS_OFICIAL = CONF.noticiasOficial ?? ('https://arquidiocesebh.org.br/wp-json/wp/v2/noticias?per_page=20&cp=' + encodeURIComponent(location.host || 'app'));
const NOTICIAS_KEY = 'central-paroquial-noticias';
let NOTICIAS = {estado:'inicial', dados:null, em:0, meta:null};
const linkArq = u => { try { const x = new URL(u); return x.origin === 'https://arquidiocesebh.org.br' ? x.href : ''; } catch(e){ return ''; } };
/* Notícias da Arquidiocese. Ordem (a mais nova vence; a Home nunca quebra por causa disto):
   1. /api/noticias (Worker: API oficial → RSS → HTML → espelho);
   2. se o Worker só tiver o espelho ou uma lista com mais de 2 h: a API oficial direto deste navegador
      (o portal libera CORS, e o navegador completa o certificado que o servidor deles manda errado);
   3. o espelho no GitHub; 4. a última lista boa guardada neste aparelho.
   NOTICIAS.meta guarda fonte, obtidoEm, atualizadoEm e idade (para o suporte ver no console; o fiel não vê). */
const idadeMin = d => d?.atualizadoEm ? Math.round((now() - Date.parse(d.atualizadoEm)) / 60000) : Infinity;
const maisNova = d => (d?.itens || []).reduce((m, i) => i.data > m ? i.data : m, '');
async function lerJson(url, ms = 8000){ const r = await fetch(url, {headers:{accept:'application/json'}, signal:AbortSignal.timeout?.(ms)}); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
async function noticiasOficiais(){
  const [{deApi, priorizar}, lista] = await Promise.all([import('./worker/noticias.js'), lerJson(NOTICIAS_OFICIAL)]);
  const itens = priorizar(deApi(lista));
  if (!itens.length) throw new Error('lista vazia');
  return {fonte:'navegador:api', atualizadoEm:new Date().toISOString(), itens};
}
async function carregarNoticias(){
  if (NOTICIAS.estado === 'carregando' || now() - NOTICIAS.em < 10*60e3) return;
  NOTICIAS.estado = 'carregando';
  const ok = d => Array.isArray(d?.itens) && d.itens.length ? d : null;
  const tentativas = [];
  let dados = null;
  if (NOTICIAS_API){ try { dados = ok(await lerJson(NOTICIAS_API)); } catch(e){ tentativas.push('api: ' + e.message); } }
  if (NOTICIAS_OFICIAL && (!dados || String(dados.fonte).startsWith('espelho') || idadeMin(dados) > 120)){
    try { const d = await noticiasOficiais(); if (!dados || maisNova(d) >= maisNova(dados)) dados = d; } catch(e){ tentativas.push('oficial: ' + e.message); }
  }
  if (!dados && NOTICIAS_ESPELHO){ try { dados = ok(await lerJson(NOTICIAS_ESPELHO)); if (dados) dados.fonte = 'espelho:' + (dados.fonte || ''); } catch(e){ tentativas.push('espelho: ' + e.message); } }
  if (dados) { try { localStorage.setItem(NOTICIAS_KEY, JSON.stringify(dados)); } catch(e){} }
  else { try { dados = ok(JSON.parse(localStorage.getItem(NOTICIAS_KEY))); if (dados) dados = {...dados, fonte:'aparelho:' + dados.fonte}; } catch(e){} }
  NOTICIAS = {estado: dados ? 'ok' : 'erro', dados: dados || NOTICIAS.dados, em: now(),
    meta: dados ? {fonte:dados.fonte, obtidoEm:dados.obtidoEm || null, atualizadoEm:dados.atualizadoEm || null, idadeMin:idadeMin(dados), maisNova:maisNova(dados), falhas:tentativas} : {falhas:tentativas}};
  if (S.mode === 'publico' && ['igreja','noticias'].includes(S.pubTab)) renderSeguro();
}
function noticiasArquidioceseHTML(limite){
  const itens = (NOTICIAS.dados?.itens || []).map(n => ({...n, url:linkArq(n.url), imagem:linkArq(n.imagem)})).filter(n => n.url && n.titulo).slice(0, limite || 50);
  const fonte = `<p class="small muted news-fonte">Fonte: Arquidiocese de Belo Horizonte · <a href="${ARQ_SITE}" target="_blank" rel="noopener">arquidiocesebh.org.br</a></p>`;
  let h = `<h3 class="news-sec">Arquidiocese de Belo Horizonte</h3>`;
  if (!itens.length){
    if (NOTICIAS.estado !== 'erro') return h + `<div class="status" role="status"><span class="spinner"></span>Buscando notícias da Arquidiocese…</div>`;
    return h + `<div class="block"><p style="margin:0 0 10px">As notícias da Arquidiocese não puderam ser carregadas agora.</p><a class="btn sm ghost" href="${ARQ_SITE}" target="_blank" rel="noopener">Ver notícias no site da Arquidiocese →</a></div>${fonte}`;
  }
  return h + itens.map(n => `<article class="notice news">
    ${n.imagem && !limite ? `<a href="${esc(n.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img class="news-img" src="${esc(n.imagem)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.remove()"></a>` : ''}
    <div class="news-meta"><span class="chip ${n.prioridade===0?'':'neutro'}">${esc(n.rotulo)}</span><span class="small muted">${esc(n.dataTexto)}</span></div>
    <h3><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.titulo)}</a></h3>
    ${n.resumo ? `<p>${esc(n.resumo)}</p>` : ''}
    <a class="news-cta" href="${esc(n.url)}" target="_blank" rel="noopener" aria-label="Ler no site da Arquidiocese: ${esc(n.titulo)}">Ler no site da Arquidiocese →</a>
  </article>`).join('') + fonte;
}

const TIPOS_INT = {gracas:'Ação de graças', falecidos:'Pelos falecidos', saude:'Pela saúde', aniversario:'Aniversário', outra:'Outras intenções'};
const NOMES_DIA = [['domingo',0],['segunda',1],['terça',2],['terca',2],['quarta',3],['quinta',4],['sexta',5],['sábado',6],['sabado',6]];
const soPrimeira = rot => /primeir|1ª/.test(rot.toLowerCase()); // "Primeira sexta-feira do mês"
function proximaPrimeira(rot){
  if (!soPrimeira(rot)) return null;
  const n = NOMES_DIA.find(([k]) => rot.toLowerCase().includes(k)); if (!n) return null;
  for (let i = 0; i < 40; i++){ const d = plusDays(i); if (d.getDay()===n[1] && d.getDate()<=7) return d; }
  return null;
}
function horariosDoDia(dia){
  const dow = dia.getDay(), r = [];
  S.cfg.missas.split('\n').forEach(l => {
    const [rot, resto] = l.includes(':') ? [l.slice(0,l.indexOf(':')), l.slice(l.indexOf(':')+1)] : ['', l];
    if (soPrimeira(rot) && dia.getDate() > 7) return;
    const low = rot.toLowerCase(), dias = new Set();
    const faixa = low.match(/(domingo|segunda|terça|terca|quarta|quinta|sexta|sábado|sabado)\S*\s+a\s+(domingo|segunda|terça|terca|quarta|quinta|sexta|sábado|sabado)/);
    if (faixa){ const a = NOMES_DIA.find(n=>n[0]===faixa[1])[1], b = NOMES_DIA.find(n=>n[0]===faixa[2])[1]; for (let d=a; d!==(b+1)%7; d=(d+1)%7) dias.add(d); }
    NOMES_DIA.forEach(([n,d]) => { if (low.includes(n)) dias.add(d); });
    if (dias.has(dow)) (resto.match(/\d{1,2}h\d{0,2}/g) || []).forEach(h => { if (!r.includes(h)) r.push(h); });
  });
  return r.sort((a,b)=>parseInt(a)-parseInt(b));
}
const dataBR = iso => { const [y,m,d] = iso.split('-'); const dd = new Date(+y,+m-1,+d); return `${DIAS[dd.getDay()]}, ${d}/${m}`; };

/* ---------- encontrar / trocar de paróquia (Diretório Arquidiocesano) ----------
   Qualquer pessoa ENCONTRA qualquer paróquia do Catálogo 2026. Só as ativas na plataforma abrem a
   Central Paroquial; as outras mostram a ficha do catálogo e como pedir a ativação (ninguém ativa sozinho).
   Sem o banco novo (supabase/diretorio.sql ainda não aplicado) ou no modo demonstração, a busca usa a
   lista REDE deste arquivo (só a RENSC). */
const keyOf = r => r.nome+'|'+r.bairro;
const vendoAtiva = () => S.vendo === ATIVA;
const semAcento = t => t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const TIPO_DIR = {paroquia_territorial:'Paróquia', paroquia_pessoal:'Paróquia pessoal', paroquia_militar:'Paróquia militar', curato:'Curato', area_pastoral:'Área pastoral', santuario:'Santuário'};
const siglaRegiao = t => { const x = semAcento(String(t || '')); return (String(t || '').match(/RENS[A-Z]{1,2}/) || [])[0]
  || [['aparecida','RENSA'],['conceicao','RENSC'],['esperanca','RENSE'],['boa viagem','RENSB'],['rosario','RENSER']].find(([k]) => x.includes(k))?.[1] || ''; };
const DIR = {semBanco:false, semTipo:false, fichas:new Map(), busca:{chave:null, q:null, estado:'nada', lista:[]}, timer:null};
const PILOTO_REDE = 'Santo Antônio|Jaraguá';
const daRede = r => ({slug:'rede:' + keyOf(r), name:r.nome, type:r.tipo === 'area' ? 'area_pastoral' : r.tipo === 'santuario' ? 'santuario' : 'paroquia_territorial',
  municipality:r.cidade || null, neighborhood:r.bairro || null, forania:r.forania || null, address:r.end || null, postal_code:r.cep || null, phone:r.tel || null,
  email:r.email || null, episcopal_region:'RENSC',
  active:keyOf(r) === PILOTO_REDE && E_PILOTO, tenant_slug:keyOf(r) === PILOTO_REDE && E_PILOTO ? PILOTO : null});
// Busca sem acento, sem maiúsculas e com abreviações simples (sto, sta, sra, n. s., nsra) — a mesma regra do banco.
const expandeBusca = t => (' ' + semAcento(String(t || '')).replace(/[^a-z0-9]+/g, ' ') + ' ').replace(/ n s /g, ' nossa senhora ').replace(/ nsra /g, ' nossa senhora ')
  .replace(/ sto /g, ' santo ').replace(/ sta /g, ' santa ').replace(/ sra /g, ' senhora ').replace(/\s+/g, ' ').trim();
const passaTipo = (e, tipo) => !tipo || (tipo === 'paroquia' && String(e.type || 'paroquia').startsWith('paroquia')) || (tipo === 'santuario' && !!e.is_sanctuary);
function buscaRedeLocal(q, tipo){
  const t = expandeBusca(q).split(' ').filter(Boolean);
  const l = t.length ? REDE.filter(r => { const x = expandeBusca([r.nome, r.bairro, r.cidade, r.forania, r.tipo === 'santuario' ? 'santuario' : 'paroquia'].join(' ')); return t.every(w => x.includes(w)); }) : REDE.filter(r => keyOf(r) === PILOTO_REDE && E_PILOTO);
  return l.map(daRede).filter(e => passaTipo(e, tipo)).sort((a, b) => b.active - a.active);
}
async function clienteSb(){ for (let i = 0; i < 50 && NUVEM.ativo && !NUVEM.sb; i++) await new Promise(r => setTimeout(r, 200)); return NUVEM.sb; }
// tipo: null (todos) | 'paroquia' | 'santuario'. Banco sem o diretorio_santuarios.sql: busca sem o filtro e filtra aqui.
async function buscarDiretorio(q, tipo = null){
  const sb = await clienteSb();
  if (sb && !DIR.semBanco){
    try {
      let {data, error} = await sb.rpc('public_directory_search', {p_q:q, p_limit:40, ...(tipo && !DIR.semTipo ? {p_tipo:tipo} : {})});
      if (error && tipo && !DIR.semTipo && tabelaFaltando(error)){ DIR.semTipo = true; ({data, error} = await sb.rpc('public_directory_search', {p_q:q, p_limit:40})); }
      if (error) throw error;
      return (Array.isArray(data) ? data : []).filter(e => passaTipo(e, tipo));
    }
    catch(e){ if (!tabelaFaltando(e)) throw e; DIR.semBanco = true; }
  }
  return buscaRedeLocal(q, tipo);
}
async function carregarFicha(slug){
  if (DIR.fichas.has(slug)) return;
  DIR.fichas.set(slug, null); // carregando
  let f = false;
  try {
    const sb = await clienteSb();
    if (sb && !DIR.semBanco){ const {data, error} = await sb.rpc('public_directory_entry', {p_slug:slug}); if (error) throw error; f = data || false; }
  } catch(e){ if (tabelaFaltando(e)) DIR.semBanco = true; }
  DIR.fichas.set(slug, f);
  if (S.mode === 'publico') renderSeguro();
}
// Paróquia do diretório que está sendo vista (ainda não ativa). null = carregando; false = não encontrada.

  if (!DIR.fichas.has(slug)) carregarFicha(slug);
  return DIR.fichas.get(slug) ?? null;
}

function escolherHTML(){

function dispararBusca(){
  clearTimeout(DIR.timer);

  DIR.busca = {chave, q, estado:'carregando', lista:[]};
  const res = document.getElementById('dirRes'); if (res) res.innerHTML = resultadosHTML();
  DIR.timer = setTimeout(async () => {
    let l = [], estado = 'ok';
    try { l = await buscarDiretorio(q, tipo); } catch(e){ estado = 'erro'; }
    if (chaveBusca() !== chave) return;
    DIR.busca = {chave, q, estado, lista:l};

/* ---------- avisos com ação (sem alert do navegador) ----------
   Nova solicitação, erro com "Tentar novamente"… Não bloqueiam a tela e somem sozinhos. */
function avisoToast({icone = '', titulo, linhas = [], acao = null, tempo = 9000, tipo = ''}){
  let box = document.getElementById('avisosBox');
  if (!box){ box = document.createElement('div'); box.id = 'avisosBox'; box.className = 'avisos-box'; box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
  while (box.children.length >= 3) box.firstElementChild.remove();
  const t = document.createElement('div'); t.className = 'aviso-toast' + (tipo ? ' ' + tipo : ''); t.setAttribute('role', tipo === 'erro' ? 'alert' : 'status');
  t.innerHTML = `<div class="at-l">${icone ? `<span class="at-ic" aria-hidden="true">${esc(icone)}</span>` : ''}<div class="grow"><b>${esc(titulo)}</b>${linhas.filter(Boolean).map(l => `<div class="small">${esc(l)}</div>`).join('')}</div><button type="button" class="at-x" aria-label="Fechar aviso">×</button></div>${acao ? `<button type="button" class="btn sm at-acao">${esc(acao.rotulo)}</button>` : ''}`;
  let timer;
  const fechar = () => { clearTimeout(timer); t.remove(); };
  const contar = ms => { clearTimeout(timer); timer = setTimeout(fechar, ms); };
  t.querySelector('.at-x').onclick = fechar;
  if (acao) t.querySelector('.at-acao').onclick = () => { fechar(); acao.fn(); };
  t.addEventListener('mouseenter', () => clearTimeout(timer)); t.addEventListener('mouseleave', () => contar(4000));
  t.addEventListener('focusin', () => clearTimeout(timer)); t.addEventListener('focusout', () => contar(4000));
  box.appendChild(t); contar(tempo);
  return t;
}

  p.innerHTML = `<h3>Novas atividades</h3>${l.length ? l.map((a, i) => `<button type="button" class="sino-item${a.ts > sinoAntes ? ' nao-visto' : ''}" data-at="${i}"><span class="ic" aria-hidden="true">${a.ic}</span><span class="grow"><b>${esc(a.t)}</b><span class="small" style="display:block">${esc(a.d)}</span><span class="small muted">${esc(ago(a.ts))}</span></span></button>`).join('')
    : '<p class="sino-vazio">Nenhuma novidade por enquanto 🎉<br>Quando chegar algo novo, aparece aqui.</p>'}`;
  p.querySelectorAll('[data-at]').forEach(b => b.onclick = () => { const a = l[+b.dataset.at]; fecharSino(); a.ir(); });
}
function atualizarSino(){
  const btn = document.getElementById('sino'); if (!btn || btn.hidden) return;
  const n = atividades().filter(a => a.ts > sinoVisto()).length, el = document.getElementById('sinoN');
  el.hidden = !n; el.textContent = n > 99 ? '99+' : n;
  document.getElementById('sinoSr').textContent = n ? `Novas atividades: ${n}` : 'Novas atividades: nenhuma nova';
  if (!document.getElementById('sinoPainel').hidden) desenharSino();
}
function abrirSino(){
  const btn = document.getElementById('sino'), p = document.getElementById('sinoPainel');
  sinoAntes = sinoVisto();
  try { localStorage.setItem(SINO_KEY(), String(now())); } catch(e){}
  desenharSino();
  p.style.top = Math.round(btn.getBoundingClientRect().bottom + 8) + 'px';
  p.hidden = false; btn.setAttribute('aria-expanded', 'true');
  atualizarSino();
  p.querySelector('button')?.focus();
}
function fecharSino(volta){
  const p = document.getElementById('sinoPainel'), btn = document.getElementById('sino');
  if (!p || p.hidden) return;
  p.hidden = true; btn.setAttribute('aria-expanded', 'false'); if (volta) btn.focus();
}
document.getElementById('sino').onclick = e => { e.stopPropagation(); document.getElementById('sinoPainel').hidden ? abrirSino() : fecharSino(); };
document.addEventListener('click', e => { if (!e.target.closest?.('#sinoPainel, #sino')) fecharSino(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharSino(true); });

const TIPO_DEV = {santo:'Santo', solenidade:'Solenidade', festa:'Festa', memoria:'Memória', novena:'Novena', campanha:'Campanha'};
const diaDoAno = (y, md) => new Date(y, +md.slice(0, 2) - 1, +md.slice(3));
const hoje0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
// Situação de uma devoção hoje: null (fora da janela) | {fase:'antes'|'novena'|'dia', festa:Date, dia?:n}
function faseDevocao(d, ref = hoje0()){
  for (const y of [ref.getFullYear(), ref.getFullYear() + 1]){
    const festa = diaDoAno(y, d.date), dias = Math.round((festa - ref) / DAY);
    if (dias < 0 || dias > Math.max(d.before || 0, d.novena ? Math.round((festa - diaDoAno(y, d.novena.start)) / DAY) : 0)) continue;
    if (dias === 0) return {fase:'dia', festa};
    if (d.novena){ const ini = diaDoAno(y, d.novena.start), n = Math.round((ref - ini) / DAY) + 1; if (n >= 1 && n <= d.novena.days) return {fase:'novena', festa, dia:n}; }
    if (dias <= (d.before || 0)) return {fase:'antes', festa, faltam:dias};
  }
  return null;
}
function destaquesAtivos(){
  const peso = {dia:0, novena:1, antes:2};
  return DEVOCIONAIS.filter(d => d.active).map(d => ({d, f:faseDevocao(d)})).filter(x => x.f)
    .sort((a, b) => peso[a.f.fase] - peso[b.f.fase] || a.f.festa - b.f.festa).map(x => ({...x.d, fase:x.f}));
}

  const cta = f.fase === 'novena' ? 'Rezar hoje' : d.cta;
  return `<section class="destaque" aria-labelledby="dest-${d.id}"><div class="destaque-k">${esc(dataLonga(f.festa))}${f.fase === 'antes' ? '' : ' · ' + esc(TIPO_DEV[d.type] || '')}</div>

/* =========================================================
   SALA DAS VELAS — o número de velas vira luz. Nunca mostra nomes nem pedidos.
   Até 50 velas desenhadas; acima disso, "+N pessoas rezando conosco".
   Chama em CSS (sem GIF), parada para quem pede menos movimento.
   ========================================================= */
const MAX_VELAS = 50;
// Poucas velas = velas maiores; muitas = prateleiras de até 10. O brilho do ambiente cresce com o número real.
function salaVelasHTML(){
  const n = velasHoje(), vistas = Math.min(n, MAX_VELAS), mais = n - vistas, qtd = vistas || 1;
  const escala = qtd <= 3 ? 2.1 : qtd <= 8 ? 1.65 : qtd <= 20 ? 1.3 : 1;
  const porFila = qtd <= 8 ? qtd : qtd <= 20 ? Math.ceil(qtd / 2) : 10;
  const vela = i => `<span class="mv${vistas ? '' : ' apagada'}" style="--d:${((i * 37) % 23) / 10}s"><i></i></span>`;
  const filas = []; for (let i = 0; i < qtd; i += porFila) filas.push(`<div class="prateleira">${Array.from({length:Math.min(porFila, qtd - i)}, (_, j) => vela(i + j)).join('')}</div>`);
  const brilho = vistas ? Math.min(1, .25 + vistas / 50 * .75) : .05;
  return `<button class="crumb" data-pub="igreja">‹ Início</button>
  <section class="sala" aria-labelledby="salaT" style="--brilho:${brilho.toFixed(2)}">
    <svg class="sala-cruz" viewBox="0 0 26 36" aria-hidden="true"><path d="M13 2v32M5 11h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
    <h2 id="salaT">Sala das Velas</h2>
    <p class="sala-lema">Uma comunidade unida em oração.</p>
    <div class="sala-velas" style="--s:${escala}" role="img" aria-label="${n ? `${n} vela${n === 1 ? ' acesa' : 's acesas'} nas últimas 24 horas` : 'Nenhuma vela acesa ainda hoje'}">${filas.join('')}</div>
    <p class="sala-n">${n ? `${n} vela${n === 1 ? ' acesa' : 's acesas'} nas últimas 24 horas.` : 'Seja o primeiro a acender uma vela hoje.'}</p>
    ${mais > 0 ? `<p class="sala-mais">+${mais} pessoa${mais === 1 ? '' : 's'} rezando conosco.</p>` : ''}
    <button class="btn gold" id="velaIr">Acender minha vela</button>
    <p class="sala-priv">Seu pedido permanece privado. A equipe da paróquia acolhe as intenções apresentadas.</p>
    <p class="sala-oracao">Senhor, acolhei as intenções de todos que rezam conosco.</p>
  </section>`;
}
function velasPubHTML(){ return velaStep === 'inicio' ? salaVelasHTML() : velaHTML(); }

/* =========================================================
   AGENDA — um lugar só: eventos da paróquia e das comunidades, missas especiais,
   solenidades e festas da Igreja, novenas e tempos de oração. Categorias com ícone + texto.
   ========================================================= */
const CAT_IGREJA = {
  '01-01':'Solenidade', '02-02':'Festa', '03-19':'Solenidade', '03-25':'Solenidade', '06-13':'Memória', '06-24':'Solenidade', '06-29':'Solenidade',
  '08-06':'Festa', '09-29':'Festa', '10-01':'Memória', '10-04':'Memória', '10-12':'Solenidade', '11-02':'Comemoração', '12-08':'Solenidade', '12-12':'Festa', '12-25':'Solenidade'};
function itensIgreja(dias){
  const ini = hoje0(), fim = new Date(ini.getTime() + dias * DAY), r = [];
  for (const y of [ini.getFullYear(), ini.getFullYear() + 1]){
    FIXAS.forEach(([md, t]) => r.push({data:diaDoAno(y, md), titulo:t, cat:CAT_IGREJA[md] || 'Festa', dev:DEVOCIONAIS.find(d => d.date === md && d.active)?.id}));
    moveis(y).forEach(([d, t]) => r.push({data:d, titulo:t, cat:/Domingo|Quarta|Quinta|Sexta/.test(t) ? 'Tempo litúrgico' : 'Solenidade'}));
  }
  return r.filter(x => x.data >= ini && x.data < fim).sort((a, b) => a.data - b.data);
}
function periodosAtivos(){
  const r = devocoesAtivas().map(v => ({titulo:v.nome, desc:v.desc, fim:v.fim, tipo:'Tempo de oração'}));
  DEVOCIONAIS.forEach(d => { const f = faseDevocao(d); if (f?.fase === 'novena') r.push({titulo:`Novena de ${d.title}`, desc:`Dia ${f.dia} de ${d.novena.days}`, fim:new Date(f.festa.getTime() - DAY), tipo:'Novena', dev:d.id}); });
  return r;
}
const faltaDias = d => { const n = Math.round((d - hoje0()) / DAY); return n === 0 ? 'hoje' : n === 1 ? 'amanhã' : 'em ' + n + ' dias'; };
let agFiltro = 'todos';
function horariosMissaHTML(){
  const linhas = S.cfg.missas.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const i=l.indexOf(':'); return i>0?[l.slice(0,i),l.slice(i+1).trim()]:['',l]; });
  return `<h2>Horário de missas</h2>${linhas.length ? `<div class="list">${linhas.map(([d,h])=>{ const p = proximaPrimeira(d);
    return `<div class="row"><div class="grow"><b>${esc(d)}</b>${p?`<div class="small muted">Próxima: ${DIAS[p.getDay()]}, ${pad(p.getDate())}/${pad(p.getMonth()+1)}</div>`:''}</div><span>${esc(h)}</span></div>`; }).join('')}</div>`
    : `<div class="block"><p style="margin:0 0 10px">${PREPARANDO}</p>${contatoBtn()}</div>`}`;
}
function agendaPubHTML(){
  const minha = minhaComunidade(), todos = eventosPublicos(), DIAS_AG = 60;
  const evs = (agFiltro === 'minha' && minha ? todos.filter(e => !e.community_id || e.community_id === minha.id) : todos)
    .filter(e => Date.parse(e.starts_at) < now() + DIAS_AG * DAY).map(e => ({tipo:'ev', data:new Date(Date.parse(e.starts_at)), dia:diaSP(e.starts_at), e}));
  const igreja = agFiltro === 'paroquia' || agFiltro === 'minha' ? [] : itensIgreja(DIAS_AG).map(x => ({tipo:'ig', data:x.data, dia:isoDay(x.data), x}));
  const lista = (agFiltro === 'igreja' ? igreja : [...evs, ...igreja]).sort((a, b) => a.dia.localeCompare(b.dia) || (a.tipo === 'ig' ? -1 : 1));
  const grupos = []; lista.forEach(i => { const g = grupos.at(-1); if (g?.dia === i.dia) g.itens.push(i); else grupos.push({dia:i.dia, itens:[i]}); });
  const per = agFiltro === 'paroquia' || agFiltro === 'minha' ? [] : periodosAtivos();
  const antigos = S.avisos.filter(a => a.evento && !a.eventId).sort((a,b)=>b.ts-a.ts);
  const rotDia = dia => { const [y, m, d] = dia.split('-').map(Number), dd = new Date(y, m - 1, d), n = Math.round((dd - hoje0()) / DAY); return `${n === 0 ? 'Hoje · ' : n === 1 ? 'Amanhã · ' : ''}${cap(DIAS[dd.getDay()])}, ${d} de ${MESES[m - 1]}`; };
  const filtros = [['todos','Tudo'],['paroquia','📅 Paróquia'],['igreja','⛪ Calendário da Igreja'], ...(minha ? [['minha', '★ ' + minha.name]] : [])];
  return `<h2>Agenda</h2>
  <p class="lead small">Eventos da paróquia e das comunidades, missas especiais e as datas da Igreja, num lugar só.</p>
  <div class="filtros" role="group" aria-label="O que mostrar">${filtros.map(([k, t]) => `<button data-agf="${k}" aria-pressed="${agFiltro === k}">${esc(t)}</button>`).join('')}</div>
  ${per.length ? `<h3 class="ag-sec">Em andamento</h3>${per.map(p => `<div class="ag-item ag-periodo"><span class="chip gold">🙏 ${esc(p.tipo)}</span><b>${esc(p.titulo)}</b><div class="small muted">${esc(p.desc)} · termina ${faltaDias(p.fim)}</div>${p.dev ? `<button type="button" class="btn sm ghost" data-dev="${p.dev}">Rezar hoje</button>` : ''}</div>`).join('')}` : ''}
  ${grupos.length ? `<div class="ag-grade">${grupos.map(g => `<section class="ag-grupo"><h3 class="ag-dia">${esc(rotDia(g.dia))}</h3>${g.itens.map(i => i.tipo === 'ev' ? eventoCard(i.e) :
      `<div class="ag-item ag-igreja"><span class="chip neutro">⛪ ${esc(i.x.cat)}</span><b>${esc(i.x.titulo)}</b>${i.x.dev ? `<button type="button" class="btn sm ghost" data-dev="${i.x.dev}">Rezar</button>` : ''}</div>`).join('')}</section>`).join('')}</div>`
    : `<div class="empty">${agFiltro === 'igreja' ? 'Nenhuma data especial da Igreja nos próximos dias.' : 'Não há eventos cadastrados para os próximos dias.'}</div>`}
  ${antigos.length ? `<h2>Também nos avisos</h2><div class="list">${antigos.map(a=>`<div class="row"><div class="grow"><b>${esc(a.evento.titulo)}</b><div class="small muted">${esc(a.evento.quando)}${a.evento.onde?', '+esc(a.evento.onde):''}</div></div></div>`).join('')}</div>` : ''}
  ${horariosMissaHTML()}
  ${comunidadesAtivas().some(c => c.mass_schedule) ? `<p class="small muted" style="margin:0 4px 12px">Horários das comunidades: <button class="link-btn" style="color:var(--lit);padding:0" data-pub="comunidades">ver em Comunidades</button></p>` : ''}
  <button type="button" class="btn block-w" data-acao="intencao" style="margin-top:6px">⛪ Pedir intenção de missa</button>`;
}
function bindAgendaPub(root){
  bindEventos(root); bindAcoes(root); bindDestaques(root);
  root.querySelectorAll('[data-agf]').forEach(b => b.onclick = () => { agFiltro = b.dataset.agf; render(); });
}

/* ---------- "Adicionar à minha agenda": um botão só; o mecanismo depende do aparelho ----------
   iPhone, iPad e Mac: arquivo de calendário (abre direto no app Calendário).
   Android, Windows e demais: Google Agenda (no Android abre o app). */
function plataformaAgenda(){
  const ua = navigator.userAgent || '', ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  return ios ? 'ios' : /Android/.test(ua) ? 'android' : /Macintosh/.test(ua) ? 'mac' : 'outro';
}
function adicionarAgenda(e){
  const p = plataformaAgenda();
  if (p === 'ios' || p === 'mac'){ baixarIcs(e); toast('Toque no arquivo para colocar na sua agenda.'); return; }
  window.open(googleAgendaUrl(e), '_blank', 'noopener');
}

/* ---------- roteador ---------- */
function render(){
  document.body.classList.toggle('painel-app', painelApp());
  document.body.classList.toggle('pub', S.mode==='publico');
  if (S.mode==='publico') document.body.dataset.tela = S.pubTab; else delete document.body.dataset.tela;
  if (!(S.mode==='painel' && S.tab==='comunicar')) { publicado = null; if (!removendo) avisoStatus = null; }
  renderHeader();
  if (S.mode==='painel' && NUVEM.ativo && !logado()){
    document.getElementById('tabs').innerHTML = '';
    const v = document.getElementById('view'); v.innerHTML = acessoHTML(); bindAcesso(v);
    return;
  }
  const validas = tabsFor().map(([k]) => k).concat(S.mode==='publico' ? Object.keys(SUBTELAS_PUB) : maisItens().map(([k]) => k));
  if (!validas.includes(S.mode==='painel'?S.tab:S.pubTab)) { if (S.mode==='painel') S.tab='inicio'; else S.pubTab='igreja'; }
  renderTabs();
  const v = document.getElementById('view');
  const map = S.mode==='painel' ? {
    inicio:[inicioHTML,bindInicio], comunicar:[comunicarHTML,bindComunicar], mais:[maisHTML,bindMais], agenda:[agendaAdmHTML,bindAgendaAdm], mensagens:[mensagensHTML,bindMensagens], intencoes:[intencoesHTML,bindIntencoes], pessoas:[pessoasHTML,bindPessoas],
    comunidades:[comunidadesAdmHTML,bindComunidadesAdm], equipe:[equipeHTML,bindEquipe], dizimistas:[dizimistasHTML,bindDizimistas], uso:[usoHTML,()=>{}], ajustes:[ajustesHTML,bindAjustes],
    ...(window.S24 && {secretaria24h:[S24.painelHTML, S24.bindPainel]}),
    ...(window.AGENTE && {assistente:[AGENTE.painelHTML, AGENTE.bindPainel]})
  } : { avisos:[avisosPubHTML, r => { bindEventos(r); r.querySelector('#goVela').onclick = () => { S.pubTab='velas'; velaStep='inicio'; save(); render(); scrollTo(0,0); }; }], igreja:[igrejaPubHTML, bindIgreja], noticias:[noticiasPubHTML, carregarNoticias], dizimista:[dizimistaPubHTML, bindDizimistaPub], rezar:[rezarPubHTML, bindRezarPub], liturgia:[liturgiaPubHTML, bindLiturgia], intencao:[intencaoPubHTML, bindIntencaoForm],
    velas:[velasPubHTML, bindVela], devocao:[devocaoPubHTML, r => { bindEventos(r); bindDestaques(r); }], evento:[eventoPubHTML, bindEventoPub], assistir:[assistirHTML,bindAssistir], agenda:[agendaPubHTML,bindAgendaPub],
    comunidades:[comunidadesPubHTML,bindComunidadesPub], comunidade:[comunidadePubHTML,bindComunidadesPub],
    secretaria: window.S24 ? [S24.publicoHTML, S24.bindPublico] : [igrejaPubHTML, bindIgreja],
    contato:[contatoPubHTML, r => bindDirLinhas(r, () => DIR.vizinhas || [])], doacoes:[doacoesPubHTML, bindDoacoes] };
  if (S.mode==='publico'){
    const pickBind = r => r.querySelectorAll('[data-pick]').forEach(x => { if (!x.onclick) x.onclick = () => { S.vendo = x.dataset.pick; S.pubTab='igreja'; save(); render(); scrollTo(0,0); }; });
    map.onboarding = [onboardingHTML, bindOnboarding];
    map.escolher = [escolherHTML, bindEscolher];
    if (!vendoAtiva()){ map.igreja=[inativaInicioHTML,bindInativa]; map.avisos=[inativaAvisosHTML,bindInativa]; map.agenda=[inativaMissasHTML,()=>{}]; map.contato=[inativaContatoHTML,bindInativa]; map.comunidades=map.comunidade=[inativaComunidadesHTML,bindInativa]; }
    const [h,b] = map[S.pubTab]; v.innerHTML = acessoRapidoHTML() + minhaFaixaHTML() + h() + rodapePubHTML(); b(v); pickBind(v);
    v.querySelectorAll('[data-pub]').forEach(x => { if (!x.onclick) x.onclick = () => { S.pubTab = x.dataset.pub; if (S.pubTab !== 'dizimista') dzPubEnviado = false; save(); render(); scrollTo(0,0); }; });
    if (S.pubTab==='contato' && vendoAtiva()) bindMinha(v);
    bindMinhaFaixa(v);
    bindAcoes(v); bindDestaques(v);
    return;
  }
  const [h,b] = map[S.tab], noMais = maisItens().some(([k]) => k===S.tab);
  v.innerHTML = (noMais ? '<button class="crumb" id="voltaMais">‹ Mais</button>' : '') + h(); b(v);
  v.querySelector('#voltaMais')?.addEventListener('click', () => { S.tab = 'mais'; comEdit = null; save(); render(); scrollTo(0,0); });
  if (window.S24 && pode('secretaria24h')) S24.iniciar(); // badge, 🔔 e aviso de nova solicitação em qualquer tela
  atualizarSino();
}
if (NUVEM.ativo && location.hash !== '#painel') S.mode = 'publico';
if (NUVEM.ativo && location.hash === '#painel') S.mode = 'painel';
S.pubTab = NUVEM.ativo && RAIZ_SEM_MINHA && S.mode === 'publico' ? 'onboarding' : 'igreja';
render();
iniciarNuvem();
</script>
